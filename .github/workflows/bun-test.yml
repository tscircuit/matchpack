# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Upload SI7021 visual snapshot
        uses: actions/upload-artifact@v4
        with:
          name: si7021-shared-terminal-snapshot
          path: tests/repros/__snapshots__/repro-si7021-shared-terminal-branches-shared-terminal.snap.svg
          if-no-files-found: error
