troke="none" stroke-width="0.009571432142857144"/></g><text data-type="text" data-label="U1" data-x="0" data-y="0" x="307.4625867676915" y="434.9254347293154" fill="black" font-size="18.38805284027879" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="C2" data-x="-2.0300000000000002" data-y="0" x="95.37311366674865" y="434.9254347293154" fill="black" font-size="12.182085006684698" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="R1" data-x="1.650001" data-y="1.100001" x="479.85068662287813" y="320" fill="black" font-size="11.492533025174243" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="2.550002" data-y="1.100001" x="573.8806067609676" y="320" fill="black" font-size="11.492533025174243" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="2.1000015000000003" data-y="2.300002" x="526.8656466919228" y="194.62680797507167" fill="black" font-size="13.791039630209092" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1 (GND)" data-x="-1" data-y="0.2" cx="202.98501381156203" cy="414.0299201380895" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (V3_3)" data-x="-1" data-y="0" cx="202.98501381156203" cy="434.9254347293154" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="-0.2" cx="411.940159723821" cy="455.8209493205413" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="0.2" cx="411.940159723821" cy="414.0299201380895" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (GND)" data-x="-2.5600000000000005" data-y="3.245314017740486e-17" cx="40" cy="434.9254347293154" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (V3_3)" data-x="-1.5000000000000002" data-y="-3.245314017740486e-17" cx="150.74622733349727" cy="434.9254347293154" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="1.650001" data-y="0.600001" cx="479.85068662287813" cy="372.23878647806475" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="1.650001" data-y="1.600001" cx="479.85068662287813" cy="267.76121352193525" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="2.550002" data-y="0.600001" cx="573.8806067609676" cy="372.23878647806475" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="2.550002" data-y="1.600001" cx="573.8806067609676" cy="267.76121352193525" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="2.4000015" data-y="2.300002" cx="558.2089185787618" cy="194.62680797507167" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="2.1000015000000003" data-y="2.0000020000000003" cx="526.8656466919228" cy="225.97007986191048" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="1.8000015000000003" data-y="2.300002" cx="495.52237480508404" cy="194.62680797507167" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":104.47757295612948,"c":0,"e":307.4625867676915,"b":0,"d":-104.47757295612948,"f":434.9254347293154};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
