ect data-type="rect" data-label="SJ1" data-x="0.025000000000000133" data-y="-1.1500000000000001" x="323.7250554323725" y="351.04212860310423" width="74.50110864745011" height="74.50110864745011" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.00805357142857143"/></g><text data-type="text" data-label="U1" data-x="0" data-y="0" x="357.87139689578714" y="245.49889135254992" fill="black" font-size="21.853658536585364" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="C2" data-x="-2.0300000000000002" data-y="0" x="105.80931263858096" y="245.49889135254992" fill="black" font-size="14.478048780487804" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="R1" data-x="1.7000000000000002" data-y="0.15000000000000024" x="568.9578713968958" y="226.87361419068736" fill="black" font-size="13.658536585365852" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="1.0250000000000001" data-y="-1.3499999999999999" x="485.1441241685144" y="413.12638580931264" fill="black" font-size="13.658536585365852" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="0.025000000000000133" data-y="-1.1500000000000001" x="360.9756097560976" y="388.2926829268293" fill="black" font-size="16.39024390243902" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1 (GND)" data-x="-1" data-y="0.2" cx="233.70288248337033" cy="220.66518847006654" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (V3_3)" data-x="-1" data-y="0" cx="233.70288248337033" cy="245.49889135254992" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="-0.2" cx="482.03991130820395" cy="270.3325942350333" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="0.2" cx="482.03991130820395" cy="220.66518847006654" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (GND)" data-x="-2.5600000000000005" data-y="3.245314017740486e-17" cx="40" cy="245.49889135254992" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (V3_3)" data-x="-1.5000000000000002" data-y="-3.245314017740486e-17" cx="171.61862527716187" cy="245.49889135254992" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="1.7000000000000002" data-y="0.6500000000000002" cx="568.9578713968958" cy="164.78935698447896" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="1.7000000000000002" data-y="-0.34999999999999976" cx="568.9578713968958" cy="288.95787139689577" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="1.0250000000000001" data-y="-0.8499999999999999" cx="485.1441241685144" cy="351.0421286031042" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="1.0250000000000001" data-y="-1.8499999999999999" cx="485.1441241685144" cy="475.21064301552104" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="0.025000000000000116" data-y="-1.4500000000000002" cx="360.9756097560976" cy="425.54323725055434" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="-0.27499999999999986" data-y="-1.1500000000000001" cx="323.7250554323725" cy="388.2926829268293" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="0.02500000000000015" data-y="-0.8500000000000001" cx="360.9756097560976" cy="351.04212860310423" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":124.16851441241683,"c":0,"e":357.87139689578714,"b":0,"d":-124.16851441241683,"f":245.49889135254992};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
