="line" data-label="" points="409.0909090909091,360.9090909090909 363.6363636363636,338.1818181818182" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="3.3,0.3 2.5,0.44999999999999996" data-type="line" data-label="" points="572.7272727272727,292.72727272727275 500,279.0909090909091" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="3.3,-0.3 2.5,-0.45000000000000007" data-type="line" data-label="" points="572.7272727272727,347.27272727272725 500,360.90909090909093" fill="none" stroke="black" stroke-width="1px"/></g><g><rect data-type="rect" data-label="U1" data-x="0" data-y="0" x="218.1818181818182" y="283.6363636363636" width="109.0909090909091" height="72.72727272727275" fill="rgba(245, 158, 11, 0.18)" stroke="none" stroke-width="0.011000000000000001"/></g><g><rect data-type="rect" data-label="C2" data-x="-2.0300000000000002" data-y="0" x="39.999999999999986" y="295.90909090909093" width="96.3636363636364" height="48.18181818181813" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.011000000000000001"/></g><g><rect data-type="rect" data-label="R1" data-x="2" data-y="0.45" x="409.0909090909091" y="256.3636363636364" width="90.90909090909088" height="45.45454545454544" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.011000000000000001"/></g><g><rect data-type="rect" data-label="R2" data-x="2" data-y="-0.45" x="409.0909090909091" y="338.18181818181813" width="90.90909090909088" height="45.45454545454544" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.011000000000000001"/></g><g><rect data-type="rect" data-label="SJ1" data-x="3.3" data-y="0" x="545.4545454545455" y="292.72727272727275" width="54.545454545454504" height="54.545454545454504" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.011000000000000001"/></g><text data-type="text" data-label="U1" data-x="0" data-y="0" x="272.72727272727275" y="320" fill="black" font-size="16" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="C2" data-x="-2.0300000000000002" data-y="0" x="88.18181818181819" y="320" fill="black" font-size="10.600000000000001" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="R1" data-x="2" data-y="0.45" x="454.54545454545456" y="279.0909090909091" fill="black" font-size="10" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="2" data-y="-0.45" x="454.54545454545456" y="360.9090909090909" fill="black" font-size="10" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="3.3" data-y="0" x="572.7272727272727" y="320" fill="black" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1 (GND)" data-x="-1" data-y="0.2" cx="181.81818181818184" cy="301.8181818181818" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (V3_3)" data-x="-1" data-y="0" cx="181.81818181818184" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="-0.2" cx="363.6363636363636" cy="338.1818181818182" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="0.2" cx="363.6363636363636" cy="301.8181818181818" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (GND)" data-x="-2.5600000000000005" data-y="3.245314017740486e-17" cx="39.99999999999997" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (V3_3)" data-x="-1.5000000000000002" data-y="-3.245314017740486e-17" cx="136.36363636363637" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="1.5" data-y="0.45000000000000007" cx="409.0909090909091" cy="279.09090909090907" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="2.5" data-y="0.44999999999999996" cx="500" cy="279.0909090909091" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="1.5" data-y="-0.44999999999999996" cx="409.0909090909091" cy="360.9090909090909" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="2.5" data-y="-0.45000000000000007" cx="500" cy="360.90909090909093" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="3.3" data-y="-0.3" cx="572.7272727272727" cy="347.27272727272725" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="3" data-y="1.8369701987210297e-17" cx="545.4545454545455" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="3.3" data-y="0.3" cx="572.7272727272727" cy="292.72727272727275" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":90.9090909090909,"c":0,"e":272.72727272727275,"b":0,"d":-90.9090909090909,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
