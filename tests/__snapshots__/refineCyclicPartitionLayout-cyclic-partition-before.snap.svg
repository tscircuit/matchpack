text data-type="text" data-label="U1" data-x="0" data-y="0" x="357.8713968957871" y="245.4988913525499" fill="black" font-size="21.853658536585368" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="C2" data-x="-2.03" data-y="0" x="105.8093126385809" y="245.4988913525499" fill="black" font-size="14.478048780487807" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="R1" data-x="1.7" data-y="0.15" x="568.9578713968957" y="226.87361419068736" fill="black" font-size="13.658536585365853" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="1.025" data-y="-1.35" x="485.14412416851434" y="413.12638580931264" fill="black" font-size="13.658536585365853" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="0.025" data-y="-1.15" x="360.9756097560975" y="388.29268292682923" fill="black" font-size="16.390243902439025" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1 (GND)" data-x="-1" data-y="0.2" cx="233.70288248337022" cy="220.6651884700665" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (V3_3)" data-x="-1" data-y="0" cx="233.70288248337022" cy="245.4988913525499" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="-0.2" cx="482.03991130820395" cy="270.33259423503324" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="0.2" cx="482.03991130820395" cy="220.6651884700665" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (GND)" data-x="-2.5599999999999996" data-y="3.245314017740486e-17" cx="40" cy="245.4988913525499" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (V3_3)" data-x="-1.4999999999999998" data-y="-3.245314017740486e-17" cx="171.61862527716184" cy="245.4988913525499" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="1.7" data-y="0.65" cx="568.9578713968957" cy="164.78935698447893" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="1.7" data-y="-0.35" cx="568.9578713968957" cy="288.95787139689577" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="1.025" data-y="-0.8500000000000001" cx="485.14412416851434" cy="351.04212860310423" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="1.025" data-y="-1.85" cx="485.14412416851434" cy="475.2106430155211" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="0.024999999999999984" data-y="-1.45" cx="360.9756097560975" cy="425.5432372505543" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="-0.27499999999999997" data-y="-1.15" cx="323.72505543237247" cy="388.29268292682923" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="0.02500000000000002" data-y="-0.8499999999999999" cx="360.9756097560975" cy="351.0421286031042" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":124.16851441241685,"c":0,"e":357.8713968957871,"b":0,"d":-124.16851441241685,"f":245.4988913525499};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
