2174"/></g><text data-type="text" data-label="U1" data-x="0" data-y="0" x="524.6090534979425" y="162.75720164609058" fill="black" font-size="33.31687242798354" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="C2" data-x="-2.0300000000000002" data-y="0" x="140.32921810699594" y="162.75720164609058" fill="black" font-size="22.072427983539097" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="R1" data-x="1.8" data-y="-0.3" x="865.3497942386832" y="219.5473251028807" fill="black" font-size="20.82304526748971" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="0.8" data-y="-1.3499999999999999" x="676.0493827160494" y="418.3127572016461" fill="black" font-size="20.82304526748971" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="2" data-y="-1.5499999999999998" x="903.2098765432099" y="456.17283950617286" fill="black" font-size="24.987654320987655" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1 (GND)" data-x="-1" data-y="0.2" cx="335.3086419753087" cy="124.89711934156384" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (V3_3)" data-x="-1" data-y="0" cx="335.3086419753087" cy="162.75720164609058" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="-0.2" cx="713.9094650205761" cy="200.61728395061732" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="0.2" cx="713.9094650205761" cy="124.89711934156384" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (GND)" data-x="-2.5600000000000005" data-y="3.245314017740486e-17" cx="40" cy="162.75720164609058" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (V3_3)" data-x="-1.5000000000000002" data-y="-3.245314017740486e-17" cx="240.65843621399182" cy="162.75720164609058" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="1.8" data-y="0.2" cx="865.3497942386832" cy="124.89711934156384" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="1.8" data-y="-0.8" cx="865.3497942386832" cy="314.1975308641976" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="0.8" data-y="-0.8499999999999999" cx="676.0493827160494" cy="323.66255144032925" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="0.8" data-y="-1.8499999999999999" cx="676.0493827160494" cy="512.9629629629629" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="2" data-y="-1.8499999999999999" cx="903.2098765432099" cy="512.9629629629629" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="1.7" data-y="-1.5499999999999998" cx="846.4197530864199" cy="456.17283950617286" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="2" data-y="-1.2499999999999998" cx="903.2098765432099" cy="399.3827160493827" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":189.30041152263374,"c":0,"e":524.6090534979425,"b":0,"d":-189.30041152263374,"f":162.75720164609058};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
