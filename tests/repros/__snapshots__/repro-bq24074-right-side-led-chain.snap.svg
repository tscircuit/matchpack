ill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.9500000000000002" data-y="-0.9" cx="40.00000000000003" cy="368.5212298682284" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="1.9500000000000002" data-y="-0.85" cx="336.9253294289898" cy="364.714494875549" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.9500000000000002" data-y="-0.2499999999999999" cx="336.9253294289898" cy="319.0336749633968" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.9500000000000002" data-y="-0.44999999999999996" cx="336.9253294289898" cy="334.2606149341142" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="-0.44999999999999996" data-y="2.55" cx="154.20204978038072" cy="105.85651537335289" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="-1.9500000000000002" data-y="0.7" cx="40.00000000000003" cy="246.70571010248904" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.9" data-x="0.44999999999999996" data-y="2.55" cx="222.7232796486091" cy="105.85651537335289" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.10" data-x="1.9500000000000002" data-y="0.85" cx="336.9253294289898" cy="235.28550512445096" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.12" data-x="0" data-y="-2.55" cx="188.4626647144949" cy="494.14348462664714" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.13" data-x="-1.9500000000000002" data-y="0.9" cx="40.00000000000003" cy="231.4787701317716" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.14" data-x="1.9500000000000002" data-y="-0.6499999999999999" cx="336.9253294289898" cy="349.4875549048316" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.15" data-x="-0.65" data-y="-2.55" cx="138.97510980966328" cy="494.14348462664714" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.16" data-x="0.65" data-y="-2.55" cx="237.95021961932653" cy="494.14348462664714" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.1" data-x="4.28" data-y="0.54" cx="514.3191800878478" cy="258.88726207906296" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.2" data-x="4.88" data-y="0.54" cx="560" cy="258.88726207906296" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="3.6550000000000002" data-y="0.5399999999999999" cx="466.7349926793558" cy="258.88726207906296" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2" data-x="2.575" data-y="0.5400000000000001" cx="384.5095168374817" cy="258.88726207906296" r="3" fill="black"/></g><g><circle data-type="point" data-label="R5.1" data-x="4.28" data-y="-1.2399999999999998" cx="514.3191800878478" cy="394.407027818448" r="3" fill="black"/></g><g><circle data-type="point" data-label="R5.2" data-x="4.88" data-y="-1.2399999999999998" cx="560" cy="394.407027818448" r="3" fill="black"/></g><g><circle data-type="point" data-label="D2.1" data-x="3.6550000000000002" data-y="-1.2399999999999998" cx="466.7349926793558" cy="394.407027818448" r="3" fill="black"/></g><g><circle data-type="point" data-label="D2.2" data-x="2.575" data-y="-1.2399999999999998" cx="384.5095168374817" cy="394.407027818448" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="600" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":76.13469985358711,"c":0,"e":188.4626647144949,"b":0,"d":-76.13469985358711,"f":300};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
