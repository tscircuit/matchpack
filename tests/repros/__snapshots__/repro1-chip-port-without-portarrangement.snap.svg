l="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-1.15" data-y="-0.09999999999999998" cx="228.83720930232562" cy="346.58914728682174" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="-1.15" data-y="-0.30000000000000004" cx="228.83720930232562" cy="368.2945736434109" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.15" data-y="-0.30000000000000004" cx="478.4496124031008" cy="368.2945736434109" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.15" data-y="-0.10000000000000003" cx="478.4496124031008" cy="346.58914728682174" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1.15" data-y="0.09999999999999998" cx="478.4496124031008" cy="324.88372093023264" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="1.15" data-y="0.30000000000000004" cx="478.4496124031008" cy="303.1782945736435" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="-1.3500000000000003" data-y="1.5500000000000003" cx="207.13178294573643" cy="167.5193798449613" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="-1.3500000000000003" data-y="2.5900000000000003" cx="207.13178294573643" cy="54.6511627906977" r="3" fill="black"/></g><g><circle data-type="point" data-label="D2.1" data-x="-1.85" data-y="0.10000000000000046" cx="152.8682170542636" cy="324.8837209302326" r="3" fill="black"/></g><g><circle data-type="point" data-label="D2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net6)" data-x="-2.89" data-y="0.1000000000000006" cx="40.00000000000006" cy="324.8837209302325" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="1.8499999999999999" data-y="-0.5" cx="554.4186046511628" cy="390.00000000000006" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="1.8499999999999999" data-y="-1.1" cx="554.4186046511628" cy="455.11627906976753" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="1.8499999999999999" data-y="-1.7" cx="554.4186046511628" cy="520.232558139535" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="1.8499999999999999" data-y="-2.3" cx="554.4186046511628" cy="585.3488372093024" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":108.52713178294573,"c":0,"e":353.6434108527132,"b":0,"d":-108.52713178294573,"f":335.7364341085272};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>