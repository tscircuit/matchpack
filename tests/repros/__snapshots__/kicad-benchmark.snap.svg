/g><g><circle data-type="point" data-label="LED_PWR.1" data-x="8.33" data-y="4.04" cx="506.80042626685764" cy="365.272480064675" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED_PWR.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="8.33" data-y="2.959999999999999" cx="506.80042626685764" cy="439.3547201705068" r="3" fill="black"/></g><g><circle data-type="point" data-label="RPWR.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net9)" data-x="7.12" data-y="3.8" cx="423.8008794816202" cy="381.73520008819315" r="3" fill="black"/></g><g><circle data-type="point" data-label="RPWR.2" data-x="7.12" data-y="3.2" cx="423.8008794816202" cy="422.8920001469886" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED_TX.1" data-x="8.45" data-y="5.24" cx="515.0317862786167" cy="282.95887994708414" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED_TX.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="8.45" data-y="4.160000000000001" cx="515.0317862786167" cy="357.04112005291586" r="3" fill="black"/></g><g><circle data-type="point" data-label="RTX.1" data-x="6.25" data-y="4.7" cx="364.1235193963669" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="RTX.2" data-x="6.85" data-y="4.7" cx="405.28031945516227" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED_IO2.1" data-x="8.57" data-y="6.4399999999999995" cx="523.2631462903757" cy="200.64527982949335" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED_IO2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="8.57" data-y="5.360000000000001" cx="523.2631462903757" cy="274.727519935325" r="3" fill="black"/></g><g><circle data-type="point" data-label="RIO2.1" data-x="6.13" data-y="5.9" cx="355.89215938460774" cy="237.68639988240915" r="3" fill="black"/></g><g><circle data-type="point" data-label="RIO2.2" data-x="6.7299999999999995" data-y="5.9" cx="397.04895944340313" cy="237.68639988240915" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":68.59466676465904,"c":0,"e":-64.59314788275213,"b":0,"d":-68.59466676465904,"f":642.3949337938975};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
