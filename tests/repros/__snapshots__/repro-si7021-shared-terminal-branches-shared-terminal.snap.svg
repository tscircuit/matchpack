" data-label="" points="372.94964028776985,342.0863309352518 372.94964028776985,318.705035971223" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="2.6999999999999997,0.3 2,0.44999999999999996" data-type="line" data-label="" points="531.9424460431654,271.9424460431655 466.4748201438849,257.9136690647482" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="2.6999999999999997,-0.3 2,-0.45000000000000007" data-type="line" data-label="" points="531.9424460431654,328.0575539568345 466.4748201438849,342.0863309352518" fill="none" stroke="black" stroke-width="1px"/></g><g><rect data-type="rect" data-label="U1" data-x="0" data-y="0" x="223.30935251798564" y="262.58992805755395" width="112.23021582733813" height="74.8201438848921" fill="rgba(245, 158, 11, 0.18)" stroke="none" stroke-width="0.010692307692307694"/></g><g><rect data-type="rect" data-label="C2" data-x="-2.0300000000000002" data-y="0" x="40.00000000000004" y="275.2158273381295" width="99.13669064748203" height="49.56834532374103" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.010692307692307694"/></g><g><rect data-type="rect" data-label="R1" data-x="1.5" data-y="0.45" x="372.94964028776985" y="234.53237410071944" width="93.52517985611507" height="46.76258992805754" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.010692307692307694"/></g><g><rect data-type="rect" data-label="R2" data-x="1.5" data-y="-0.45" x="372.94964028776985" y="318.705035971223" width="93.52517985611507" height="46.76258992805754" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.010692307692307694"/></g><g><rect data-type="rect" data-label="SJ1" data-x="2.6999999999999997" data-y="0" x="503.8848920863309" y="271.9424460431655" width="56.11510791366902" height="56.11510791366902" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.010692307692307694"/></g><text data-type="text" data-label="U1" data-x="0" data-y="0" x="279.4244604316547" y="300" fill="black" font-size="16.46043165467626" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="C2" data-x="-2.0300000000000002" data-y="0" x="89.56834532374106" y="300" fill="black" font-size="10.905035971223022" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="R1" data-x="1.5" data-y="0.45" x="419.7122302158274" y="257.9136690647482" fill="black" font-size="10.287769784172662" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="1.5" data-y="-0.45" x="419.7122302158274" y="342.0863309352518" fill="black" font-size="10.287769784172662" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="2.6999999999999997" data-y="0" x="531.9424460431654" y="300" fill="black" font-size="12.345323741007194" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1 (GND)" data-x="-1" data-y="0.2" cx="185.89928057553962" cy="281.294964028777" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (V3_3)" data-x="-1" data-y="0" cx="185.89928057553962" cy="300" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="-0.2" cx="372.94964028776985" cy="318.705035971223" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="0.2" cx="372.94964028776985" cy="281.294964028777" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (GND)" data-x="-2.5600000000000005" data-y="3.245314017740486e-17" cx="40.00000000000003" cy="300" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (V3_3)" data-x="-1.5000000000000002" data-y="-3.245314017740486e-17" cx="139.13669064748206" cy="300" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="1" data-y="0.45000000000000007" cx="372.94964028776985" cy="257.9136690647482" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="2" data-y="0.44999999999999996" cx="466.4748201438849" cy="257.9136690647482" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="1" data-y="-0.44999999999999996" cx="372.94964028776985" cy="342.0863309352518" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="2" data-y="-0.45000000000000007" cx="466.4748201438849" cy="342.0863309352518" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="2.6999999999999997" data-y="-0.3" cx="531.9424460431654" cy="328.0575539568345" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="2.4" data-y="1.8369701987210297e-17" cx="503.884892086331" cy="300" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="2.6999999999999997" data-y="0.3" cx="531.9424460431654" cy="271.9424460431655" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="600" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":93.5251798561151,"c":0,"e":279.4244604316547,"b":0,"d":-93.5251798561151,"f":300};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>