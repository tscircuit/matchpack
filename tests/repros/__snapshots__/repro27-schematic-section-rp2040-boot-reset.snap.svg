 fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.008714285714285716"/></g><g><rect data-type="rect" data-label="SW2" data-x="1.1272276749999997" data-y="-1.6750000000000003" x="352.91086147540983" y="177.7049180327869" width="82.49794918032774" height="107.86885245901641" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.008714285714285716"/></g><text data-type="text" data-label="R3" data-x="0.8772276749999997" data-y="-0.30500000000000027" x="365.47131147540983" y="74.42622950819677" fill="black" font-size="15.147540983606556" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R3</text><text data-type="text" data-label="R2" data-x="-0.18472767499999976" data-y="-3.0450000000000004" x="243.6075827868853" y="388.8524590163934" fill="black" font-size="15.147540983606556" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SW3" data-x="0.06527232500000026" data-y="-4.415000000000001" x="272.2961073770492" y="546.0655737704918" fill="black" font-size="18.149548819672102" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SW3</text><text data-type="text" data-label="SW2" data-x="1.1272276749999997" data-y="-1.6750000000000003" x="394.1598360655737" y="231.6393442622951" fill="black" font-size="18.149548819672102" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SW2</text><g><circle data-type="point" data-label="R3.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="0.8772276749999997" data-y="-0.6050000000000002" cx="365.47131147540983" cy="108.85245901639347" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net23)" data-x="0.8772276749999997" data-y="-0.005000000000000282" cx="365.47131147540983" cy="40.00000000000005" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-0.1847276749999997" data-y="-2.7450000000000006" cx="243.6075827868853" cy="354.42622950819674" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net12)" data-x="-0.1847276749999998" data-y="-3.345" cx="243.6075827868853" cy="423.27868852459017" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW3.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net12)" data-x="0.015272325000000336" data-y="-3.945000000000001" cx="266.55840245901646" cy="492.1311475409837" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW3.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="0.01527232500000017" data-y="-4.885000000000001" cx="266.55840245901646" cy="600" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net23)" data-x="1.0772276749999998" data-y="-1.2050000000000003" cx="388.422131147541" cy="177.7049180327869" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="1.0772276749999996" data-y="-2.1450000000000005" cx="388.42213114754094" cy="285.5737704918033" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":114.75409836065572,"c":0,"e":264.8058405737705,"b":0,"d":-114.75409836065572,"f":39.42622950819674};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>