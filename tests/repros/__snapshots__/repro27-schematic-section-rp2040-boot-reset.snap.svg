oup_0_connectivity_net0)" data-x="0.015272325000000087" data-y="-2.7450000000000006" cx="118.05020903538983" cy="74.37140097686154" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net12)" data-x="0.015272324999999976" data-y="-3.345" cx="118.0502090353898" cy="212.10706398049058" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW3.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net12)" data-x="0.015272325000000114" data-y="-3.945000000000001" cx="118.05020903538983" cy="349.84272698411985" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW3.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="0.015272324999999948" data-y="-4.885000000000001" cx="118.05020903538978" cy="565.6285990231386" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net23)" data-x="1.5697276749999998" data-y="-3.945000000000001" cx="474.8901061050369" cy="349.84272698411985" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="1.5697276749999995" data-y="-4.885000000000001" cx="474.8901061050369" cy="565.6285990231386" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":229.55943833938184,"c":0,"e":114.5443026862533,"b":0,"d":-229.55943833938184,"f":-555.7692572647418};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>