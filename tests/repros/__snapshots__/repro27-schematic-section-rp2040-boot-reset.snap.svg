 fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.0054275988392857135"/></g><g><rect data-type="rect" data-label="SW2" data-x="2.2197276749999997" data-y="-4.415000000000001" x="442.5721252986988" y="343.95165962875575" width="132.45464915284884" height="173.18892346946302" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.0054275988392857135"/></g><text data-type="text" data-label="R3" data-x="2.1697276749999994" data-y="-3.0450000000000004" x="499.58727309483254" y="178.13247758352497" fill="black" font-size="24.320146699967157" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R3</text><text data-type="text" data-label="R2" data-x="0.015272325000000031" data-y="-3.0450000000000004" x="102.64280210597596" y="178.13247758352497" fill="black" font-size="24.320146699967157" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SW3" data-x="0.06527232500000003" data-y="-4.415000000000001" x="111.85497888626655" y="430.54612136348726" fill="black" font-size="29.140022813626757" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SW3</text><text data-type="text" data-label="SW2" data-x="2.2197276749999997" data-y="-4.415000000000001" x="508.7994498751232" y="430.54612136348726" fill="black" font-size="29.140022813626757" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SW2</text><g><circle data-type="point" data-label="R3.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="2.1697276749999994" data-y="-3.345" cx="499.58727309483254" cy="233.40553826526843" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net23)" data-x="2.1697276749999994" data-y="-2.7450000000000006" cx="499.58727309483254" cy="122.85941690178146" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="0.015272325000000087" data-y="-2.7450000000000006" cx="102.64280210597597" cy="122.85941690178146" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net12)" data-x="0.015272324999999976" data-y="-3.345" cx="102.64280210597596" cy="233.40553826526843" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW3.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net12)" data-x="0.015272325000000114" data-y="-3.945000000000001" cx="102.64280210597599" cy="343.9516596287557" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW3.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="0.015272324999999948" data-y="-4.885000000000001" cx="102.64280210597595" cy="517.1405830982187" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net23)" data-x="2.169727675" data-y="-3.945000000000001" cx="499.58727309483265" cy="343.9516596287557" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="2.1697276749999994" data-y="-4.885000000000001" cx="499.58727309483254" cy="517.1405830982187" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":184.2435356058118,"c":0,"e":99.82897495105493,"b":0,"d":-184.2435356058118,"f":-382.889088336172};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>