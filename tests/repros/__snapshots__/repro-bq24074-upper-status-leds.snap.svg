="text" data-label="R4" data-x="3.46" data-y="-0.25" x="384.7549019607843" y="315.9313725490196" fill="black" font-size="8.411764705882353" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R4</text><text data-type="text" data-label="D1" data-x="3.315" data-y="1.88" x="375.5147058823529" y="180.19607843137254" fill="black" font-size="15.842156862745098" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">D1</text><text data-type="text" data-label="R5" data-x="5.27" data-y="-0.25" x="500.0980392156863" y="315.9313725490196" fill="black" font-size="8.411764705882353" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R5</text><text data-type="text" data-label="D2" data-x="5.645" data-y="1.88" x="523.9950980392157" y="180.19607843137254" fill="black" font-size="15.842156862745098" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">D2</text><g><circle data-type="point" data-label="U1.1" data-x="-1.9500000000000002" data-y="-0.7000000000000001" cx="40" cy="344.6078431372549" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.9500000000000002" data-y="-0.9" cx="40" cy="357.3529411764706" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="1.9500000000000002" data-y="-0.85" cx="288.5294117647059" cy="354.1666666666667" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5 (charger_upper_connectivity_net2)" data-x="1.9500000000000002" data-y="-0.2499999999999999" cx="288.5294117647059" cy="315.9313725490196" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.9500000000000002" data-y="-0.44999999999999996" cx="288.5294117647059" cy="328.6764705882353" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7 (charger_upper_connectivity_net0)" data-x="-0.44999999999999996" data-y="2.55" cx="135.58823529411765" cy="137.5" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="-1.9500000000000002" data-y="0.7" cx="40" cy="255.39215686274508" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.9 (charger_upper_connectivity_net1)" data-x="0.44999999999999996" data-y="2.55" cx="192.94117647058826" cy="137.5" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.10 (charger_upper_connectivity_net2)" data-x="1.9500000000000002" data-y="0.85" cx="288.5294117647059" cy="245.83333333333334" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.12" data-x="0" data-y="-2.55" cx="164.26470588235296" cy="462.5" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.13" data-x="-1.9500000000000002" data-y="0.9" cx="40" cy="242.64705882352942" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.14" data-x="1.9500000000000002" data-y="-0.6499999999999999" cx="288.5294117647059" cy="341.421568627451" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.15" data-x="-0.65" data-y="-2.55" cx="122.84313725490198" cy="462.5" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.16" data-x="0.65" data-y="-2.55" cx="205.68627450980392" cy="462.5" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.1 (charger_upper_connectivity_net2)" data-x="3.16" data-y="-0.25" cx="365.6372549019608" cy="315.9313725490196" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.2 (charger_upper_connectivity_net3)" data-x="3.76" data-y="-0.25" cx="403.87254901960785" cy="315.9313725490196" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1 (charger_upper_connectivity_net3)" data-x="2.775" data-y="1.88" cx="341.1029411764706" cy="180.19607843137254" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (charger_upper_connectivity_net0)" data-x="3.855" data-y="1.88" cx="409.9264705882353" cy="180.19607843137254" r="3" fill="black"/></g><g><circle data-type="point" data-label="R5.1 (charger_upper_connectivity_net2)" data-x="4.97" data-y="-0.25" cx="480.98039215686276" cy="315.9313725490196" r="3" fill="black"/></g><g><circle data-type="point" data-label="R5.2 (charger_upper_connectivity_net4)" data-x="5.569999999999999" data-y="-0.25" cx="519.2156862745098" cy="315.9313725490196" r="3" fill="black"/></g><g><circle data-type="point" data-label="D2.1 (charger_upper_connectivity_net4)" data-x="5.1049999999999995" data-y="1.88" cx="489.58333333333337" cy="180.19607843137254" r="3" fill="black"/></g><g><circle data-type="point" data-label="D2.2 (charger_upper_connectivity_net1)" data-x="6.185" data-y="1.88" cx="558.406862745098" cy="180.19607843137254" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="600" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":63.72549019607843,"c":0,"e":164.26470588235296,"b":0,"d":-63.72549019607843,"f":300};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>