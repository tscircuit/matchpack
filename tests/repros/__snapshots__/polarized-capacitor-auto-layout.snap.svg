<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-3.79,-0.49999999999999994 -2.22,-0.49999999999999994" data-type="line" data-label="" points="95.5956678700361,370.54151624548734 254.29602888086637,370.54151624548734" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1px"/></g><g><polyline data-points="-1.2000000000000002,0.30000000000000004 -3.79,0.10000000000000003" data-type="line" data-label="" points="357.4007220216606,289.6750902527076 95.5956678700361,309.8916967509025" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="-1.2000000000000002,0.30000000000000004 -2.22,0.10000000000000003" data-type="line" data-label="" points="357.4007220216606,289.6750902527076 254.29602888086637,309.8916967509025" fill="none" stroke="black" stroke-width="1px"/></g><g><rect data-type="rect" data-label="C1" data-x="-3.79" data-y="-0.19999999999999996" x="40.00000000000003" y="309.8916967509025" width="111.19133574007213" height="60.64981949458485" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.009892857142857142"/></g><g><rect data-type="rect" data-label="C2" data-x="-2.22" data-y="-0.19999999999999996" x="211.84115523465698" y="309.8916967509025" width="84.90974729241879" height="60.64981949458485" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.009892857142857142"/></g><g><rect data-type="rect" data-label="U1" data-x="0" data-y="0" x="397.8339350180505" y="229.02527075812276" width="161.7328519855596" height="181.94945848375448" fill="rgba(245, 158, 11, 0.18)" stroke="none" stroke-width="0.009892857142857142"/></g><text data-type="text" data-label="C1" data-x="-3.79" data-y="-0.19999999999999996" x="95.5956678700361" y="340.21660649819495" fill="black" font-size="13.342960288808666" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C1</text><text data-type="text" data-label="C2" data-x="-2.22" data-y="-0.19999999999999996" x="254.29602888086637" y="340.21660649819495" fill="black" font-size="13.342960288808666" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="U1" data-x="0" data-y="0" x="478.7003610108303" y="320" fill="black" font-size="35.37906137184115" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-3.79" data-y="-0.49999999999999994" cx="95.5956678700361" cy="370.54151624548734" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-3.79" data-y="0.10000000000000003" cx="95.5956678700361" cy="309.8916967509025" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="-2.22" data-y="0.10000000000000003" cx="254.29602888086637" cy="309.8916967509025" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.22" data-y="-0.49999999999999994" cx="254.29602888086637" cy="370.54151624548734" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="357.4007220216606" cy="289.6750902527076" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="357.4007220216606" cy="309.8916967509025" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="357.4007220216606" cy="330.10830324909745" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="357.4007220216606" cy="350.3249097472924" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="600" cy="350.3249097472924" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="600" cy="330.1083032490975" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="600" cy="309.89169675090255" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="600" cy="289.6750902527076" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":101.08303249097473,"c":0,"e":478.7003610108303,"b":0,"d":-101.08303249097473,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>