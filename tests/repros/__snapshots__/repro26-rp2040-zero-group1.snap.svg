2341156267887" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net0)" data-x="-1.9449999999999998" data-y="0.4000000000000001" cx="592.4212936462508" cy="357.87063537492844" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net1)" data-x="-1.9449999999999998" data-y="0.20000000000000007" cx="592.4212936462508" cy="378.9353176874642" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net0)" data-x="-1.9449999999999998" data-y="5.551115123125783e-17" cx="592.4212936462508" cy="400" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="0.05500000000000016" data-y="0.10000000000000006" cx="803.0681167716085" cy="389.4676588437321" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net41)" data-x="0.05500000000000016" data-y="0.30000000000000004" cx="803.0681167716085" cy="368.4029765311963" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":105.32341156267888,"c":0,"e":797.2753291356612,"b":0,"d":-105.32341156267888,"f":400};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>