line="central">LED6</text><text data-type="text" data-label="R15" data-x="-0.11250000000000004" data-y="-0.8775" x="95.62289562289563" y="401.5488215488216" fill="black" font-size="12.444444444444446" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R15</text><text data-type="text" data-label="R16" data-x="2.2675" data-y="-0.8775000000000004" x="320" y="401.5488215488216" fill="black" font-size="12.444444444444446" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R16</text><text data-type="text" data-label="R17" data-x="4.6475" data-y="-0.8774999999999995" x="544.3771043771044" y="401.54882154882154" fill="black" font-size="12.444444444444446" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R17</text><g><circle data-type="point" data-label="LED4.1" data-x="-0.11250000000000007" data-y="0.0475000000000001" cx="95.62289562289563" cy="314.34343434343435" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED4.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-0.11250000000000002" data-y="1.1275000000000002" cx="95.62289562289563" cy="212.52525252525254" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED5.1" data-x="2.2675" data-y="0.047499999999999876" cx="320" cy="314.34343434343435" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED5.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="2.2675" data-y="1.1275" cx="320" cy="212.52525252525254" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED6.1" data-x="4.6475" data-y="0.04750000000000032" cx="544.3771043771044" cy="314.34343434343435" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED6.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net5)" data-x="4.6475" data-y="1.1275000000000004" cx="544.3771043771044" cy="212.52525252525248" r="3" fill="black"/></g><g><circle data-type="point" data-label="R15.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-0.11250000000000006" data-y="-1.1775" cx="95.62289562289563" cy="429.8316498316499" r="3" fill="black"/></g><g><circle data-type="point" data-label="R15.2" data-x="-0.11250000000000003" data-y="-0.5774999999999999" cx="95.62289562289563" cy="373.2659932659933" r="3" fill="black"/></g><g><circle data-type="point" data-label="R16.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="2.2675" data-y="-1.1775000000000004" cx="320" cy="429.8316498316499" r="3" fill="black"/></g><g><circle data-type="point" data-label="R16.2" data-x="2.2675" data-y="-0.5775000000000003" cx="320" cy="373.2659932659933" r="3" fill="black"/></g><g><circle data-type="point" data-label="R17.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="4.6475" data-y="-1.1774999999999995" cx="544.3771043771044" cy="429.8316498316498" r="3" fill="black"/></g><g><circle data-type="point" data-label="R17.2" data-x="4.6475" data-y="-0.5774999999999995" cx="544.3771043771044" cy="373.26599326599325" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":94.27609427609428,"c":0,"e":106.22895622895624,"b":0,"d":-94.27609427609428,"f":318.82154882154884};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>