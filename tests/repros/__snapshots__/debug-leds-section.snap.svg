cle data-type="point" data-label="LED6.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net5)" data-x="3.4474999999999993" data-y="1.1274999999999995" cx="530.295358649789" cy="185.31645569620255" r="3" fill="black"/></g><g><circle data-type="point" data-label="R15.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-0.11250000000000006" data-y="-1.1775000000000004" cx="109.704641350211" cy="457.6371308016878" r="3" fill="black"/></g><g><circle data-type="point" data-label="R15.2" data-x="-0.11250000000000003" data-y="-0.5775000000000003" cx="109.704641350211" cy="386.7510548523207" r="3" fill="black"/></g><g><circle data-type="point" data-label="R16.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="1.6674999999999998" data-y="-1.1775000000000004" cx="320" cy="457.6371308016878" r="3" fill="black"/></g><g><circle data-type="point" data-label="R16.2" data-x="1.6674999999999998" data-y="-0.5775000000000003" cx="320" cy="386.7510548523207" r="3" fill="black"/></g><g><circle data-type="point" data-label="R17.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="3.4474999999999993" data-y="-1.1775000000000004" cx="530.295358649789" cy="457.6371308016878" r="3" fill="black"/></g><g><circle data-type="point" data-label="R17.2" data-x="3.4474999999999993" data-y="-0.5775000000000003" cx="530.295358649789" cy="386.7510548523207" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":118.14345991561183,"c":0,"e":122.99578059071735,"b":0,"d":-118.14345991561183,"f":318.52320675105483};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>