source_group_0_connectivity_net5)" data-x="1.1925" data-y="-4.794999999999999" cx="431.4858096828047" cy="543.9065108514191" r="3" fill="black"/></g><g><circle data-type="point" data-label="R15.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-0.8775" data-y="-0.5949999999999999" cx="237.96327212020032" cy="151.25208681135223" r="3" fill="black"/></g><g><circle data-type="point" data-label="R15.2" data-x="-0.8775" data-y="0.0050000000000001155" cx="237.96327212020032" cy="95.15859766277126" r="3" fill="black"/></g><g><circle data-type="point" data-label="R16.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-0.8775" data-y="-2.994999999999999" cx="237.96327212020032" cy="375.6260434056761" r="3" fill="black"/></g><g><circle data-type="point" data-label="R16.2" data-x="-0.8775" data-y="-2.3949999999999996" cx="237.96327212020032" cy="319.53255425709517" r="3" fill="black"/></g><g><circle data-type="point" data-label="R17.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-0.8775" data-y="-5.394999999999999" cx="237.96327212020032" cy="600" r="3" fill="black"/></g><g><circle data-type="point" data-label="R17.2" data-x="-0.8775" data-y="-4.794999999999999" cx="237.96327212020032" cy="543.9065108514191" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":93.4891485809683,"c":0,"e":320,"b":0,"d":-93.4891485809683,"f":95.62604340567611};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
