="black"/></g><g><circle data-type="point" data-label="R1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-3.367778697655222e-17" data-y="-5.169999999999999" cx="479.0664012237762" cy="760" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="3.367778697655222e-17" data-y="-4.069999999999999" cx="479.0664012237762" cy="621.5384615384614" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="1.978910699999999" data-y="-5.164999999999999" cx="728.1600557692307" cy="759.3706293706293" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="1.978910699999999" data-y="-4.0649999999999995" cx="728.1600557692307" cy="620.909090909091" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="-1.9789106999999992" data-y="-5.164999999999999" cx="229.97274667832173" cy="759.3706293706293" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-1.9789106999999992" data-y="-4.0649999999999995" cx="229.97274667832173" cy="620.909090909091" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="2.2434776749999994" data-y="0.2625000000000002" cx="761.4621924825174" cy="76.18881118881116" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net5)" data-x="2.2434776749999994" data-y="-0.8374999999999999" cx="761.4621924825174" cy="214.65034965034965" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net5)" data-x="2.2434776749999994" data-y="-1.4624999999999995" cx="761.4621924825174" cy="293.3216783216783" r="3" fill="black"/></g><g><circle data-type="point" data-label="LED1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="2.2434776749999994" data-y="-2.5424999999999995" cx="761.4621924825174" cy="429.26573426573424" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":125.8741258741259,"c":0,"e":479.0664012237762,"b":0,"d":-125.8741258741259,"f":109.23076923076923};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>