000000000007" cx="172.0175438596491" cy="418.2456140350878" r="3" fill="black"/></g><g><circle data-type="point" data-label="J4.10 (D4)" data-x="0.7375000000000003" data-y="-0.5" cx="172.0175438596491" cy="442.8070175438596" r="3" fill="black"/></g><g><circle data-type="point" data-label="J4.11 (D5)" data-x="0.7375000000000003" data-y="-0.6999999999999993" cx="172.0175438596491" cy="467.36842105263145" r="3" fill="black"/></g><g><circle data-type="point" data-label="J4.12 (D6)" data-x="0.7375000000000003" data-y="-0.8999999999999986" cx="172.0175438596491" cy="491.9298245614033" r="3" fill="black"/></g><g><circle data-type="point" data-label="J4.13 (D7)" data-x="0.7375000000000003" data-y="-1.1000000000000014" cx="172.0175438596491" cy="516.4912280701756" r="3" fill="black"/></g><g><circle data-type="point" data-label="J4.14 (V3V3)" data-x="0.7375000000000003" data-y="-1.3000000000000007" cx="172.0175438596491" cy="541.0526315789474" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.1 (GND)" data-x="4.222500000000002" data-y="2.3000000000000007" cx="599.9999999999999" cy="98.94736842105266" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.2 (CF0)" data-x="4.222500000000002" data-y="2.1000000000000014" cx="599.9999999999999" cy="123.50877192982449" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.3 (CF1)" data-x="4.222500000000002" data-y="1.9000000000000004" cx="599.9999999999999" cy="148.07017543859655" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.4 (F6)" data-x="4.222500000000002" data-y="1.700000000000001" cx="599.9999999999999" cy="172.63157894736838" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.5 (UPDI)" data-x="4.222500000000002" data-y="1.5" cx="599.9999999999999" cy="197.19298245614044" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.6 (V3V3)" data-x="4.222500000000002" data-y="1.3000000000000007" cx="599.9999999999999" cy="221.75438596491225" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.7 (CA0)" data-x="4.222500000000002" data-y="1.1000000000000014" cx="599.9999999999999" cy="246.31578947368408" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.8 (CA1)" data-x="4.222500000000002" data-y="0.9000000000000004" cx="599.9999999999999" cy="270.8771929824561" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.9 (A2)" data-x="4.222500000000002" data-y="0.7000000000000011" cx="599.9999999999999" cy="295.43859649122794" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.10 (A3)" data-x="4.222500000000002" data-y="0.5" cx="599.9999999999999" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.11 (A4)" data-x="4.222500000000002" data-y="0.3000000000000007" cx="599.9999999999999" cy="344.56140350877183" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.12 (A5)" data-x="4.222500000000002" data-y="0.10000000000000142" cx="599.9999999999999" cy="369.12280701754366" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.13 (A6)" data-x="4.222500000000002" data-y="-0.09999999999999787" cx="599.9999999999999" cy="393.6842105263155" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.14 (GND)" data-x="4.222500000000002" data-y="-0.3000000000000007" cx="599.9999999999999" cy="418.2456140350878" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":122.80701754385959,"c":0,"e":81.4473684210526,"b":0,"d":-122.80701754385959,"f":381.4035087719298};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>