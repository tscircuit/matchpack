 fill="black"/></g><g><circle data-type="point" data-label="J5.7 (CA0)" data-x="4.222500000000002" data-y="0.10000000000000142" cx="599.9999999999999" cy="307.71929824561386" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.8 (CA1)" data-x="4.222500000000002" data-y="-0.09999999999999964" cx="599.9999999999999" cy="332.2807017543859" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.9 (A2)" data-x="4.222500000000002" data-y="-0.29999999999999893" cx="599.9999999999999" cy="356.84210526315775" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.10 (A3)" data-x="4.222500000000002" data-y="-0.5" cx="599.9999999999999" cy="381.4035087719298" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.11 (A4)" data-x="4.222500000000002" data-y="-0.6999999999999993" cx="599.9999999999999" cy="405.96491228070164" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.12 (A5)" data-x="4.222500000000002" data-y="-0.8999999999999986" cx="599.9999999999999" cy="430.5263157894735" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.13 (A6)" data-x="4.222500000000002" data-y="-1.0999999999999979" cx="599.9999999999999" cy="455.08771929824525" r="3" fill="black"/></g><g><circle data-type="point" data-label="J5.14 (GND)" data-x="4.222500000000002" data-y="-1.3000000000000007" cx="599.9999999999999" cy="479.64912280701753" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":122.80701754385959,"c":0,"e":81.4473684210526,"b":0,"d":-122.80701754385959,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>