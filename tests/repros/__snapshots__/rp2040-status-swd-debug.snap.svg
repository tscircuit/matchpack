" data-label="SW_RUN.2" data-x="12.33" data-y="-12" cx="369.96083583861594" cy="162.49196760439872" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW_RUN.3" data-x="13.270000000000001" data-y="-12" cx="439.79033307164957" cy="162.49196760439872" r="3" fill="black"/></g><g><circle data-type="point" data-label="SW_RUN.4 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net0)" data-x="13.270000000000001" data-y="-12" cx="439.79033307164957" cy="162.49196760439872" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net0)" data-x="10.4" data-y="-13.739999999999998" cx="226.58750641334484" cy="291.7508241846948" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2" data-x="10.4" data-y="-12.66" cx="226.58750641334484" cy="211.52118906589044" r="3" fill="black"/></g><g><circle data-type="point" data-label="D_PWR.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net0)" data-x="14.5" data-y="-13.940000000000001" cx="531.1629730680656" cy="306.6081640215107" r="3" fill="black"/></g><g><circle data-type="point" data-label="D_PWR.2" data-x="14.5" data-y="-12.86" cx="531.1629730680656" cy="226.37852890270597" r="3" fill="black"/></g><g><circle data-type="point" data-label="R_BOOT.1" data-x="8.6" data-y="-13.8" cx="92.87144788200396" cy="296.2080261357396" r="3" fill="black"/></g><g><circle data-type="point" data-label="R_BOOT.2 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net6)" data-x="8.6" data-y="-13.2" cx="92.87144788200396" cy="251.63600662529257" r="3" fill="black"/></g><g><circle data-type="point" data-label="R_LED.1" data-x="10.4" data-y="-11.899999999999999" cx="226.58750641334484" cy="155.06329768599085" r="3" fill="black"/></g><g><circle data-type="point" data-label="R_LED.2" data-x="10.4" data-y="-12.5" cx="226.58750641334484" cy="199.63531719643788" r="3" fill="black"/></g><g><circle data-type="point" data-label="R_PWR_LED.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net6)" data-x="14.5" data-y="-11.899999999999999" cx="531.1629730680656" cy="155.06329768599085" r="3" fill="black"/></g><g><circle data-type="point" data-label="R_PWR_LED.2" data-x="14.5" data-y="-12.5" cx="531.1629730680656" cy="199.63531719643788" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_SWCLK.1" data-x="8.4" data-y="-16.5" cx="78.01410804518832" cy="496.7821139327509" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_GND.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net0)" data-x="10.200000000000001" data-y="-16.5" cx="211.7301665765293" cy="496.7821139327509" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_SWDIO.1" data-x="12" data-y="-16.5" cx="345.4462251078701" cy="496.7821139327509" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_3V3.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net6)" data-x="13.8" data-y="-16.5" cx="479.16228363921095" cy="496.7821139327509" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":74.28669918407826,"c":0,"e":-545.994165101069,"b":0,"d":-74.28669918407826,"f":-728.9484226045404};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
