D_PWR.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net0)" data-x="3.2533660499999986" data-y="-1.6048638375" cx="537.0823404278855" cy="350.896232404923" r="3" fill="black"/></g><g><circle data-type="point" data-label="D_PWR.2" data-x="3.2533660499999986" data-y="-0.5248638374999999" cx="537.0823404278855" cy="273.4435484726875" r="3" fill="black"/></g><g><circle data-type="point" data-label="R_BOOT.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net27)" data-x="0.9114106999999991" data-y="-0.004863837499999746" cx="369.12796310662804" cy="236.15151546827778" r="3" fill="black"/></g><g><circle data-type="point" data-label="R_BOOT.2 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net6)" data-x="0.9114106999999991" data-y="0.5951361625000002" cx="369.12796310662804" cy="193.12224661703584" r="3" fill="black"/></g><g><circle data-type="point" data-label="R_PWR_LED.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net6)" data-x="3.2533660499999986" data-y="0.7001361625" cx="537.0823404278855" cy="185.5921245680685" r="3" fill="black"/></g><g><circle data-type="point" data-label="R_PWR_LED.2" data-x="3.2533660499999986" data-y="0.10013616249999996" cx="537.0823404278855" cy="228.62139341931046" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_SWCLK.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net43)" data-x="-3.1593750000000003" data-y="-3.5783660499999983" cx="77.1897425714761" cy="492.42682787189517" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_GND.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net0)" data-x="-3.1593750000000003" data-y="-0.10981845000000012" cx="77.1897425714761" cy="243.67838253234518" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_SWDIO.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net44)" data-x="-3.1593750000000003" data-y="-4.978366049999998" cx="77.1897425714761" cy="592.8284551914597" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_3V3.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net6)" data-x="-3.1593750000000003" data-y="2.630272325" cx="77.1897425714761" cy="47.17154480854026" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":71.71544808540327,"c":0,"e":303.76573636629706,"b":0,"d":-71.71544808540327,"f":235.80270318255072};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
