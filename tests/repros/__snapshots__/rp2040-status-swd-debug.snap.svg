ta-x="5.265866049999998" data-y="-3.0755446500000003" cx="493.9517414312617" cy="411.4877589453861" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_SWCLK.1" data-x="-1.690625" data-y="-5.15054465" cx="127.13112109227873" cy="520.9039548022599" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_GND.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net0)" data-x="-1.690625" data-y="-3.3405446500000004" cx="127.13112109227873" cy="425.46139359698685" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_SWDIO.1" data-x="-1.690625" data-y="-6.550544649999999" cx="127.13112109227873" cy="594.7269303201507" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_3V3.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net6)" data-x="-1.690625" data-y="3.5894553499999993" cx="127.13112109227873" cy="60.03766478342749" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":52.73069679849342,"c":0,"e":216.27895536723167,"b":0,"d":-52.73069679849342,"f":249.31214651600752};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
