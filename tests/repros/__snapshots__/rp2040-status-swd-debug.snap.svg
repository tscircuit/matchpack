"black"/></g><g><circle data-type="point" data-label="R_PWR_LED.2" data-x="0.4699999999999997" data-y="3.3319553499999994" cx="303.69261424473933" cy="275.9812218340578" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_SWCLK.1" data-x="1.7240624999999998" data-y="-3.5783660499999983" cx="354.95899813495555" cy="558.4768627587935" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_GND.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net0)" data-x="1.7240624999999998" data-y="-0.10981845000000012" cx="354.95899813495555" cy="416.68178252707605" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_SWDIO.1" data-x="1.7240624999999998" data-y="-4.49409225" cx="354.95899813495555" cy="595.911975368834" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_3V3.1 (unnamedsubcircuitsubcircuit_source_group_1_connectivity_net6)" data-x="1.7240624999999998" data-y="9.004455349999999" cx="354.95899813495555" cy="44.08802463116598" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":40.88024631166008,"c":0,"e":284.4788984782591,"b":0,"d":-40.88024631166008,"f":412.19237724151134};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
