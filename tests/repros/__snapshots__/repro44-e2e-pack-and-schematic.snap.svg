t data-type="text" data-label="R3" data-x="2.19" data-y="-0.9999999999999993" x="539.5978062157221" y="378.8665447897623" fill="black" font-size="13.513711151736747" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R3</text><g><circle data-type="point" data-label="U1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="438.24497257769656" cy="307.2029250457039" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="192.54113345521023" cy="307.2029250457039" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="438.24497257769656" cy="266.25228519195616" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="192.54113345521023" cy="245.7769652650823" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="192.54113345521023" cy="266.25228519195616" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="192.54113345521023" cy="286.72760511883007" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="438.24497257769656" cy="286.72760511883007" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="438.24497257769656" cy="245.7769652650823" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="2.19" data-y="0.5000000000000007" cx="539.5978062157221" cy="225.3016453382084" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="2.19" data-y="-0.09999999999999937" cx="539.5978062157221" cy="286.72760511882996" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1" data-x="1.2000000000000004" data-y="1.8399999999999999" cx="438.24497257769656" cy="88.11700182815363" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="0.6000000000000003" data-y="1.8399999999999999" cx="376.819012797075" cy="88.11700182815363" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-1.2000000000000002" data-y="-1.55" cx="192.54113345521023" cy="435.1736745886655" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-1.2000000000000002" data-y="-2.15" cx="192.54113345521023" cy="496.59963436928706" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="-2.27" data-y="0.09999999999999892" cx="82.99817184643513" cy="266.2522851919563" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.27" data-y="-0.5000000000000011" cx="82.99817184643513" cy="327.6782449725779" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="2.19" data-y="-1.924999999999999" cx="539.5978062157221" cy="473.56489945155386" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="2.19" data-y="-3.004999999999999" cx="539.5978062157221" cy="584.1316270566726" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.1" data-x="2.19" data-y="-0.6999999999999993" cx="539.5978062157221" cy="348.15356489945157" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.2" data-x="2.19" data-y="-1.2999999999999994" cx="539.5978062157221" cy="409.5795246800731" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":102.37659963436928,"c":0,"e":315.3930530164534,"b":0,"d":-102.37659963436928,"f":276.4899451553931};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>