<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-1.3,0.7000000000000002 -0.6000000000000001,0.7" data-type="line" data-label="" points="180,169.23076923076917 330.76923076923083,169.23076923076923" fill="none" stroke="black" stroke-width="1px"/></g><g><rect data-type="rect" data-label="U1" data-x="0" data-y="0" x="416.92307692307696" y="40" width="86.15384615384619" height="560" fill="rgba(245, 158, 11, 0.18)" stroke="none" stroke-width="0.004642857142857142"/></g><g><rect data-type="rect" data-label="R1" data-x="-1.6" data-y="0.7000000000000002" x="50.76923076923072" y="95.99999999999996" width="129.23076923076928" height="146.46153846153842" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.004642857142857142"/></g><text data-type="text" data-label="U1" data-x="0" data-y="0" x="460.00000000000006" y="320" fill="black" font-size="18.953846153846158" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="R1" data-x="-1.6" data-y="0.7000000000000002" x="115.38461538461536" y="169.23076923076917" fill="black" font-size="28.430769230769236" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><g><circle data-type="point" data-label="U1.1" data-x="-0.6000000000000001" data-y="0.7" cx="330.76923076923083" cy="169.23076923076923" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-0.6000000000000001" data-y="0.49999999999999994" cx="330.76923076923083" cy="212.30769230769232" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-0.6000000000000001" data-y="0.29999999999999993" cx="330.76923076923083" cy="255.3846153846154" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="-0.6000000000000001" data-y="0.09999999999999987" cx="330.76923076923083" cy="298.4615384615385" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="-0.6000000000000001" data-y="-0.10000000000000009" cx="330.76923076923083" cy="341.53846153846155" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="-0.6000000000000001" data-y="-0.30000000000000004" cx="330.76923076923083" cy="384.61538461538464" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="-0.6000000000000001" data-y="-0.5" cx="330.76923076923083" cy="427.69230769230774" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="-0.6000000000000001" data-y="-0.7" cx="330.76923076923083" cy="470.7692307692308" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.9" data-x="0.6000000000000001" data-y="-0.7" cx="589.2307692307693" cy="470.7692307692308" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.10" data-x="0.6000000000000001" data-y="-0.49999999999999994" cx="589.2307692307693" cy="427.6923076923077" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.11" data-x="0.6000000000000001" data-y="-0.29999999999999993" cx="589.2307692307693" cy="384.61538461538464" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.12" data-x="0.6000000000000001" data-y="-0.09999999999999987" cx="589.2307692307693" cy="341.5384615384615" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.13" data-x="0.6000000000000001" data-y="0.10000000000000009" cx="589.2307692307693" cy="298.46153846153845" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.14" data-x="0.6000000000000001" data-y="0.30000000000000004" cx="589.2307692307693" cy="255.38461538461536" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.15" data-x="0.6000000000000001" data-y="0.5" cx="589.2307692307693" cy="212.3076923076923" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.16" data-x="0.6000000000000001" data-y="0.7" cx="589.2307692307693" cy="169.23076923076923" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1" data-x="-1.3" data-y="0.7000000000000002" cx="180" cy="169.23076923076917" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="-1.9000000000000001" data-y="0.7000000000000002" cx="50.76923076923072" cy="169.23076923076917" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":215.38461538461542,"c":0,"e":460.00000000000006,"b":0,"d":-215.38461538461542,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>