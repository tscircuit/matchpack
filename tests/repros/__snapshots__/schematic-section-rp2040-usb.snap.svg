492146597" y="432.46073298429326" width="56.96335078534025" height="50.26178010471199" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.011937499999999998"/></g><text data-type="text" data-label="U3" data-x="0" data-y="0" x="224.29319371727752" y="274.5549738219895" fill="black" font-size="29.319371727748692" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U3</text><text data-type="text" data-label="R8" data-x="4.145" data-y="-0.3750000000000009" x="571.5183246073299" y="305.9685863874346" fill="black" font-size="11.05759162303665" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R8</text><text data-type="text" data-label="R9" data-x="4.145" data-y="-2.1850000000000005" x="571.5183246073299" y="457.59162303664925" fill="black" font-size="11.05759162303665" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R9</text><g><circle data-type="point" data-label="U3.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net38)" data-x="2.6" data-y="0.8499999999999999" cx="442.09424083769636" cy="203.35078534031413" r="3" fill="black"/></g><g><circle data-type="point" data-label="U3.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net25)" data-x="2.6" data-y="0.6499999999999999" cx="442.09424083769636" cy="220.1047120418848" r="3" fill="black"/></g><g><circle data-type="point" data-label="U3.3 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net24)" data-x="2.6" data-y="0.44999999999999996" cx="442.09424083769636" cy="236.85863874345546" r="3" fill="black"/></g><g><circle data-type="point" data-label="U3.4 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net41)" data-x="2.6" data-y="0.10000000000000009" cx="442.09424083769636" cy="266.1780104712042" r="3" fill="black"/></g><g><circle data-type="point" data-label="U3.5 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net42)" data-x="2.6" data-y="-0.09999999999999987" cx="442.09424083769636" cy="282.93193717277484" r="3" fill="black"/></g><g><circle data-type="point" data-label="U3.6" data-x="2.6" data-y="-0.44999999999999984" cx="442.09424083769636" cy="312.25130890052355" r="3" fill="black"/></g><g><circle data-type="point" data-label="U3.7" data-x="2.6" data-y="-0.6499999999999999" cx="442.09424083769636" cy="329.0052356020942" r="3" fill="black"/></g><g><circle data-type="point" data-label="U3.8 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="2.6" data-y="-0.8499999999999999" cx="442.09424083769636" cy="345.7591623036649" r="3" fill="black"/></g><g><circle data-type="point" data-label="R8.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net41)" data-x="4.145" data-y="-0.0750000000000009" cx="571.5183246073299" cy="280.8376963350786" r="3" fill="black"/></g><g><circle data-type="point" data-label="R8.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="4.145" data-y="-0.6750000000000009" cx="571.5183246073299" cy="331.09947643979064" r="3" fill="black"/></g><g><circle data-type="point" data-label="R9.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net42)" data-x="4.145" data-y="-1.8850000000000005" cx="571.5183246073299" cy="432.46073298429326" r="3" fill="black"/></g><g><circle data-type="point" data-label="R9.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="4.145" data-y="-2.4850000000000003" cx="571.5183246073299" cy="482.72251308900525" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":83.76963350785341,"c":0,"e":224.29319371727752,"b":0,"d":-83.76963350785341,"f":274.5549738219895};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>