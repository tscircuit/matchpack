e data-type="point" data-label="F1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-1.9558333333333324" data-y="2.473333333333333" cx="211.43356949182188" cy="237.41800052479667" r="3" fill="black"/></g><g><circle data-type="point" data-label="F1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-3.0158333333333323" data-y="2.473333333333333" cx="149.12971223650834" cy="237.41800052479667" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-1.2850000000000001" data-y="0.2" cx="250.86329047494087" cy="371.0382226887081" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="-1.2850000000000001" data-y="0" cx="250.86329047494087" cy="382.79366745386164" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.3 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-1.2850000000000001" data-y="-0.2" cx="250.86329047494087" cy="394.54911221901517" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.4" data-x="1.2850000000000001" data-y="-0.1" cx="401.9207557071634" cy="388.6713898364384" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.5 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="1.2850000000000001" data-y="0.1" cx="401.9207557071634" cy="376.9159450712849" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.469999999999999" data-y="1.6675000000000002" cx="181.21228024140643" cy="284.7826467243943" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="-2.469999999999999" data-y="1.0675000000000001" cx="181.21228024140643" cy="320.0489810198548" r="3" fill="black"/></g><g><circle data-type="point" data-label="C4.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="2.0075" data-y="2.813333333333333" cx="444.3872999212804" cy="217.43374442403572" r="3" fill="black"/></g><g><circle data-type="point" data-label="C4.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="2.0075" data-y="2.2133333333333334" cx="444.3872999212804" cy="252.70007871949622" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="3.35875" data-y="1.5083333333333333" cx="523.8100236158488" cy="294.1380215166623" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="3.35875" data-y="0.42833333333333323" cx="523.8100236158488" cy="357.6174232484912" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="3.35875" data-y="-0.19666666666666682" cx="523.8100236158488" cy="394.35318813959594" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="3.35875" data-y="-0.7966666666666669" cx="523.8100236158488" cy="429.6195224350564" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="4.192500000000001" data-y="2.813333333333333" cx="572.8155339805825" cy="217.43374442403572" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="4.192500000000001" data-y="2.2133333333333334" cx="572.8155339805825" cy="252.70007871949622" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":58.777223825767514,"c":0,"e":326.3920230910521,"b":0,"d":-58.777223825767514,"f":382.79366745386164};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
