e data-type="point" data-label="F1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-1.5558333333333325" data-y="2.473333333333333" cx="239.12445278298935" cy="238.54909318323953" r="3" fill="black"/></g><g><circle data-type="point" data-label="F1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-2.615833333333333" data-y="2.473333333333333" cx="175.48467792370226" cy="238.54909318323953" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-1.2850000000000001" data-y="0.2" cx="255.3846153846153" cy="375.03439649781114" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="-1.2850000000000001" data-y="0" cx="255.3846153846153" cy="387.04190118824266" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.3 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-1.2850000000000001" data-y="-0.2" cx="255.3846153846153" cy="399.0494058786742" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.4" data-x="1.2850000000000001" data-y="-0.1" cx="409.6810506566604" cy="393.04565353345845" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.5 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="1.2850000000000001" data-y="0.1" cx="409.6810506566604" cy="381.0381488430269" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.469999999999999" data-y="1.6675000000000002" cx="184.2401500938086" cy="286.92933083176985" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="-2.469999999999999" data-y="1.0675000000000001" cx="184.2401500938086" cy="322.9518449030644" r="3" fill="black"/></g><g><circle data-type="point" data-label="C4.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="2.6075" data-y="0.10000000000000026" cx="489.0806754221388" cy="381.0381488430269" r="3" fill="black"/></g><g><circle data-type="point" data-label="C4.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="2.6075" data-y="-0.4999999999999997" cx="489.0806754221388" cy="417.0606629143214" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="3.35875" data-y="2.4424999999999994" cx="534.1838649155723" cy="240.40025015634774" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="3.35875" data-y="1.3624999999999994" cx="534.1838649155723" cy="305.24077548467795" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="3.35875" data-y="0.7374999999999994" cx="534.1838649155723" cy="342.76422764227647" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="3.35875" data-y="0.13749999999999934" cx="534.1838649155723" cy="378.786741713571" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="3.9924999999999997" data-y="0.10000000000000026" cx="572.2326454033771" cy="381.0381488430269" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="3.9924999999999997" data-y="-0.4999999999999997" cx="572.2326454033771" cy="417.0606629143214" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":60.03752345215761,"c":0,"e":332.53283302063784,"b":0,"d":-60.03752345215761,"f":387.04190118824266};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
