tivity_net3)" data-x="-1.2850000000000001" data-y="0" cx="255.4521578926737" cy="299.71698483007333" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.3 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-1.2850000000000001" data-y="-0.2" cx="255.4521578926737" cy="310.2536160871781" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.4" data-x="1.2850000000000001" data-y="-0.1" cx="390.8478695464701" cy="304.9853004586257" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.5 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="1.2850000000000001" data-y="0.1" cx="390.8478695464701" cy="294.44866920152094" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.6075" data-y="0.3" cx="185.77868370506837" cy="283.91203794441617" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="-2.6075" data-y="-0.3" cx="185.77868370506837" cy="315.5219317157305" r="3" fill="black"/></g><g><circle data-type="point" data-label="C4.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="2.6075" data-y="0.3" cx="460.52134373407546" cy="283.91203794441617" r="3" fill="black"/></g><g><circle data-type="point" data-label="C4.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="2.6075" data-y="-0.3" cx="460.52134373407546" cy="315.5219317157305" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="1.7349999999999999" data-y="-1.3249999999999997" cx="414.55528987495586" cy="369.5221669083925" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="1.7349999999999999" data-y="-2.405" cx="414.55528987495586" cy="426.41997569675823" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="1.7349999999999999" data-y="-3.0300000000000002" cx="414.55528987495586" cy="459.34694837521073" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="1.7349999999999999" data-y="-3.63" cx="414.55528987495586" cy="490.956842146525" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="4.7925" data-y="0.3" cx="575.6340402179452" cy="283.91203794441617" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="4.7925" data-y="-0.3" cx="575.6340402179452" cy="315.5219317157305" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":52.683156285523886,"c":0,"e":323.1500137195719,"b":0,"d":-52.683156285523886,"f":299.71698483007333};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>