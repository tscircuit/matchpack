ce_group_0_connectivity_net3)" data-x="2.0075" data-y="-0.3" cx="476.7634972367861" cy="409.9343441500165" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="3.35875" data-y="2.4424999999999994" cx="562.5449907892872" cy="235.832034386661" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="3.35875" data-y="1.3624999999999994" cx="562.5449907892872" cy="304.393746162203" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="3.35875" data-y="0.7374999999999994" cx="562.5449907892872" cy="344.070662698975" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="3.35875" data-y="0.13749999999999934" cx="562.5449907892872" cy="382.16050257427617" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="3.3924999999999996" data-y="0.3" cx="564.6875442822728" cy="371.8445042747154" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="3.3924999999999996" data-y="-0.3" cx="564.6875442822728" cy="409.9343441500165" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":63.483066458835204,"c":0,"e":349.32124132067446,"b":0,"d":-63.483066458835204,"f":390.88942421236595};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
