a-x="-1.5558333333333325" data-y="2.473333333333333" cx="239.12445278298935" cy="236.14759224515322" r="3" fill="black"/></g><g><circle data-type="point" data-label="F1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-2.615833333333333" data-y="2.473333333333333" cx="175.48467792370226" cy="236.14759224515322" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-1.2850000000000001" data-y="0.2" cx="255.3846153846153" cy="372.63289555972483" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="-1.2850000000000001" data-y="0" cx="255.3846153846153" cy="384.64040025015635" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.3 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-1.2850000000000001" data-y="-0.2" cx="255.3846153846153" cy="396.64790494058786" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.4" data-x="1.2850000000000001" data-y="-0.1" cx="409.6810506566604" cy="390.64415259537213" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.5 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="1.2850000000000001" data-y="0.1" cx="409.6810506566604" cy="378.63664790494056" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.469999999999999" data-y="1.6675000000000002" cx="184.2401500938086" cy="284.52782989368353" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="-2.469999999999999" data-y="1.0675000000000001" cx="184.2401500938086" cy="320.5503439649781" r="3" fill="black"/></g><g><circle data-type="point" data-label="C4.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="2.6075" data-y="-0.09999999999999992" cx="489.0806754221388" cy="390.6441525953721" r="3" fill="black"/></g><g><circle data-type="point" data-label="C4.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="2.6075" data-y="-0.7" cx="489.0806754221388" cy="426.6666666666667" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="3.35875" data-y="2.4424999999999994" cx="534.1838649155723" cy="237.99874921826142" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="3.35875" data-y="1.3624999999999994" cx="534.1838649155723" cy="302.83927454659164" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="3.35875" data-y="0.7374999999999994" cx="534.1838649155723" cy="340.36272670419015" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="3.35875" data-y="0.13749999999999934" cx="534.1838649155723" cy="376.3852407754847" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="3.9924999999999997" data-y="-0.09999999999999992" cx="572.2326454033771" cy="390.6441525953721" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="3.9924999999999997" data-y="-0.7" cx="572.2326454033771" cy="426.6666666666667" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":60.03752345215761,"c":0,"e":332.53283302063784,"b":0,"d":-60.03752345215761,"f":384.64040025015635};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
