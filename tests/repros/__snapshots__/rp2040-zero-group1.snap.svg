="376.19663648124197" width="128.53816300129358" height="130.91849935316947" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.008402173913043478"/></g><g><rect data-type="rect" data-label="C5" data-x="1.125" data-y="-0.45000000000000007" x="860.025873221216" y="388.098318240621" width="99.97412677878401" height="130.9184993531694" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.008402173913043478"/></g><g><rect data-type="rect" data-label="U1" data-x="-0.9449999999999998" data-y="0.20000000000000007" x="592.2380336351875" y="280.9831824062096" width="142.82018111254854" height="190.42690815006466" fill="rgba(245, 158, 11, 0.18)" stroke="none" stroke-width="0.008402173913043478"/></g><text data-type="text" data-label="C6" data-x="-2.685" data-y="-0.35" x="456.5588615782665" y="441.65588615782667" fill="black" font-size="28.278395860284604" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C6</text><text data-type="text" data-label="C1" data-x="-4.165" data-y="-0.35" x="280.41397153945667" y="441.65588615782667" fill="black" font-size="28.278395860284604" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C1</text><text data-type="text" data-label="C2" data-x="-5.6450000000000005" data-y="-0.35" x="104.26908150064685" y="441.65588615782667" fill="black" font-size="28.278395860284604" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="C5" data-x="1.125" data-y="-0.45000000000000007" x="910.012936610608" y="453.5575679172057" fill="black" font-size="21.99430789133247" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C5</text><text data-type="text" data-label="U1" data-x="-0.9449999999999998" data-y="0.20000000000000007" x="663.6481241914619" y="376.1966364812419" fill="black" font-size="31.42043984476068" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><g><circle data-type="point" data-label="C6.1 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net0)" data-x="-2.41" data-y="0.20000000000000007" cx="489.28848641655884" cy="376.1966364812419" r="3" fill="black"/></g><g><circle data-type="point" data-label="C6.2 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net1)" data-x="-2.41" data-y="-0.9" cx="489.28848641655884" cy="507.1151358344114" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net0)" data-x="-3.89" data-y="0.20000000000000007" cx="313.143596377749" cy="376.1966364812419" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net1)" data-x="-3.89" data-y="-0.9" cx="313.143596377749" cy="507.1151358344114" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net0)" data-x="-5.370000000000001" data-y="0.20000000000000007" cx="136.9987063389391" cy="376.1966364812419" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net1)" data-x="-5.37" data-y="-0.9" cx="136.9987063389392" cy="507.1151358344114" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.1 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net41)" data-x="1.28" data-y="0.09999999999999998" cx="928.4605433376455" cy="388.098318240621" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.2 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net1)" data-x="1.28" data-y="-1" cx="928.4605433376455" cy="519.0168175937904" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net0)" data-x="-1.9449999999999998" data-y="0.4000000000000001" cx="544.6313065976715" cy="352.3932729624838" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net1)" data-x="-1.9449999999999998" data-y="0.20000000000000007" cx="544.6313065976715" cy="376.1966364812419" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net0)" data-x="-1.9449999999999998" data-y="5.551115123125783e-17" cx="544.6313065976715" cy="400" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="0.05500000000000016" data-y="0.10000000000000006" cx="782.6649417852523" cy="388.0983182406209" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5 (unnamedsubcircuitsubcircuit_source_group_5_connectivity_net41)" data-x="0.05500000000000016" data-y="0.30000000000000004" cx="782.6649417852523" cy="364.29495472186284" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":119.01681759379042,"c":0,"e":776.1190168175938,"b":0,"d":-119.01681759379042,"f":400};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>