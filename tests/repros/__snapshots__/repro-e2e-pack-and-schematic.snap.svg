</g><g><circle data-type="point" data-label="R1.2" data-x="2.47" data-y="0.7250000000000003" cx="676.9463082113077" cy="296.62010085087184" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1" data-x="1.4305446500000008" data-y="-0.7249999999999999" cx="552.716494045965" cy="469.91588555172245" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="1.4305446500000008" data-y="-1.825" cx="552.716494045965" cy="601.381653255816" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-0.41945534999999956" data-y="-0.7249999999999999" cx="331.6149756345348" cy="469.91588555172245" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-0.4194553499999998" data-y="-1.825" cx="331.6149756345348" cy="601.381653255816" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="-2.2394553499999996" data-y="0.9249999999999999" cx="114.0988872513982" cy="272.7172339955821" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.2394553499999996" data-y="-0.17500000000000016" cx="114.0988872513982" cy="404.1830016996757" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="4.448910699999999" data-y="-1.0000000000000002" cx="913.4545031143487" cy="502.78232747774587" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="4.448910699999999" data-y="-2.08" cx="913.4545031143487" cy="631.8578084963104" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.1" data-x="4.448910699999999" data-y="0.7249999999999996" cx="913.4545031143487" cy="296.6201008508719" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.2" data-x="4.448910699999999" data-y="-0.3750000000000004" cx="913.4545031143487" cy="428.08586855496543" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":119.51433427644868,"c":0,"e":381.74590254847953,"b":0,"d":-119.51433427644868,"f":383.26799320129714};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>