-label="R1.2" data-x="2.47" data-y="0.7250000000000003" cx="731.4118412491868" cy="521.0930383864671" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1" data-x="1.4305446500000008" data-y="-0.7249999999999999" cx="634.0263042290176" cy="656.9420949902407" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="1.4305446500000008" data-y="-1.825" cx="634.0263042290176" cy="760" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-0.41945534999999956" data-y="-0.7249999999999999" cx="460.7016458035134" cy="656.9420949902407" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-0.4194553499999998" data-y="-1.825" cx="460.7016458035134" cy="760" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="-2.2394553499999996" data-y="0.9249999999999999" cx="290.187657514639" cy="502.3552374756018" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.2394553499999996" data-y="-0.17500000000000016" cx="290.187657514639" cy="605.413142485361" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="1.4305446500000016" data-y="4.135000000000001" cx="634.0263042290177" cy="201.61353285621334" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="1.4305446500000016" data-y="3.0550000000000006" cx="634.0263042290177" cy="302.7976577748861" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.1" data-x="1.4305446500000016" data-y="5.86" cx="634.0263042290177" cy="40" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.2" data-x="1.4305446500000016" data-y="4.760000000000001" cx="634.0263042290177" cy="143.05790500975922" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":93.6890045543266,"c":0,"e":500,"b":0,"d":-93.6890045543266,"f":589.0175666883539};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>