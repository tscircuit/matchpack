circuit_source_group_0_connectivity_net0)" data-x="2.2394553499999996" data-y="1.0000000000000002" cx="800.9691786338894" cy="195.83510239882276" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="2.2394553499999996" data-y="-0.09999999999999987" cx="800.9691786338894" cy="329.86995928031195" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1" data-x="1.2000000000000002" data-y="1.8894553499999995" cx="674.3116794775729" cy="87.45508372634566" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="0.10000000000000009" data-y="1.8894553499999995" cx="540.2768225960837" cy="87.45508372634566" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-0.6500000000000001" data-y="-1.55" cx="448.88942017688646" cy="506.5522706240932" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-0.6500000000000004" data-y="-2.6500000000000004" cx="448.8894201768864" cy="640.5871275055824" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="-2.47" data-y="0.09999999999999987" cx="227.12265697296795" cy="305.4999853018594" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.47" data-y="-1.0000000000000002" cx="227.12265697296795" cy="439.5348421833486" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="2.2394553499999996" data-y="-2.525" cx="800.9691786338894" cy="625.3558937690495" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="2.2394553499999996" data-y="-3.605" cx="800.9691786338894" cy="756.9537532526934" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.1" data-x="2.2394553499999996" data-y="-0.8" cx="800.9691786338894" cy="415.164868204896" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.2" data-x="2.2394553499999996" data-y="-1.9000000000000001" cx="800.9691786338894" cy="549.1997250863852" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":121.8498698922629,"c":0,"e":528.0918356068573,"b":0,"d":-121.8498698922629,"f":317.68497229108567};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>