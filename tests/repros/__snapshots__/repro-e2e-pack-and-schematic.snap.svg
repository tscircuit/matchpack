><g><circle data-type="point" data-label="R1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="2.2394553499999996" data-y="1.0000000000000002" cx="730.789278242476" cy="228.1865646830729" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="2.2394553499999996" data-y="-0.09999999999999987" cx="730.789278242476" cy="370.7655256019825" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1" data-x="1.2000000000000002" data-y="1.8894553499999995" cx="596.0579475837475" cy="112.89781960419569" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="0.10000000000000009" data-y="1.8894553499999995" cx="453.47898666483786" cy="112.89781960419569" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-0.6500000000000001" data-y="-1.55" cx="356.2660587655813" cy="558.7105195405452" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-0.6500000000000004" data-y="-2.6500000000000004" cx="356.2660587655813" cy="701.2894804594548" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="-2.47" data-y="-0.10000000000000009" cx="120.36268706338547" cy="370.7655256019825" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.47" data-y="-1.2000000000000002" cx="120.36268706338547" cy="513.3444865208921" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="3.618366049999999" data-y="-1.8250000000000002" cx="909.519873520627" cy="594.3552597702726" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="3.618366049999999" data-y="-2.9050000000000002" cx="909.519873520627" cy="734.341875945202" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.1" data-x="3.618366049999999" data-y="-0.10000000000000009" cx="909.519873520627" cy="370.7655256019825" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.2" data-x="3.618366049999999" data-y="-1.2000000000000002" cx="909.519873520627" cy="513.3444865208921" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":129.6172371990087,"c":0,"e":440.517262944937,"b":0,"d":-129.6172371990087,"f":357.80380188208164};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
