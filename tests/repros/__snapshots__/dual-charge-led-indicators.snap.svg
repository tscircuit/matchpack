18)" stroke="none" stroke-width="0.009752178571428571"/></g><g><rect data-type="rect" data-label="R4" data-x="2.1" data-y="-1.0225" x="347.62357128993165" y="429.20636780792574" width="61.52471425798632" height="69.72800949238444" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.009752178571428571"/></g><g><rect data-type="rect" data-label="CHG_GREEN" data-x="3.59" data-y="-0.4825" x="470.6729998059043" y="350.7623571289932" width="120.99860470737309" height="115.8715451858742" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.009752178571428571"/></g><text data-type="text" data-label="IC1" data-x="0" data-y="0" x="163.04942851597264" y="359.2220053394663" fill="black" font-size="35.88941665049202" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">IC1</text><text data-type="text" data-label="R3" data-x="2.1" data-y="1.0225" x="378.3859284189248" y="254.37363812481465" fill="black" font-size="13.53543713675699" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R3</text><text data-type="text" data-label="CHG_RED" data-x="3.59" data-y="1.5625" x="531.1723021595908" y="199.00139529262694" fill="black" font-size="25.49173994089233" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">CHG_RED</text><text data-type="text" data-label="R4" data-x="2.1" data-y="-1.0225" x="378.3859284189248" y="464.07037255411797" fill="black" font-size="13.53543713675699" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R4</text><text data-type="text" data-label="CHG_GREEN" data-x="3.59" data-y="-0.4825" x="531.1723021595908" y="408.6981297219303" fill="black" font-size="25.49173994089233" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">CHG_GREEN</text><g><circle data-type="point" data-label="IC1.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="39.999999999999986" cy="328.4596482104731" r="3" fill="black"/></g><g><circle data-type="p