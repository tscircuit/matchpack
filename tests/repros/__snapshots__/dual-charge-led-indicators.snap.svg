78" width="116.40441336075423" height="121.55505112007972" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.009707535714285715"/></g><g><rect data-type="rect" data-label="R4" data-x="2.1" data-y="-0.8899999999999999" x="349.0382655595248" y="376.65701535257955" width="61.80765311190498" height="70.04867352682561" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.009707535714285715"/></g><g><rect data-type="rect" data-label="CHG_GREEN" data-x="3.565" data-y="-0.8899999999999999" x="472.65357178333477" y="350.9038265559525" width="116.40441336075423" height="121.55505112007972" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.009707535714285715"/></g><text data-type="text" data-label="IC1" data-x="0" data-y="0" x="163.61530622380994" y="320" fill="black" font-size="36.05446431527789" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">IC1</text><text data-type="text" data-label="R3" data-x="2.1" data-y="0.8899999999999999" x="379.9420921154773" y="228.31864788400765" fill="black" font-size="13.59768368461909" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R3</text><text data-type="text" data-label="CHG_RED" data-x="3.565" data-y="0.8899999999999999" x="530.8557784637119" y="228.31864788400765" fill="black" font-size="25.608970939365953" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">CHG_RED</text><text data-type="text" data-label="R4" data-x="2.1" data-y="-0.8899999999999999" x="379.9420921154773" y="411.68135211599235" fill="black" font-size="13.59768368461909" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R4</text><text data-type="text" data-label="CHG_GREEN" data-x="3.565" data-y="-0.8899999999999999" x="530.8557784637119" y="411.68135211599235" fill="black" font-size="25.608970939365953" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">CHG_GREEN</text><g><circle data-type="point" data-label="IC1.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="40.000000000000014" cy="289.0961734440475" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="40.000000000000014" cy="309.6987244813492" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="40.000000000000014" cy="330.3012755186508" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="40.000000000000014" cy="350.9038265559525" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="287.2306124476199" cy="350.9038265559525" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="287.2306124476199" cy="330.3012755186508" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="287.2306124476199" cy="309.6987244813492" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="287.2306124476199" cy="289.0961734440475" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.1" data-x="2.4" data-y="0.8899999999999999" cx="410.8459186714298" cy="228.31864788400765" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.2" data-x="1.8" data-y="0.8899999999999999" cx="349.0382655595248" cy="228.31864788400765" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_RED.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="4.105" data-y="0.8899999999999998" cx="586.4826662644264" cy="228.31864788400767" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_RED.2" data-x="3.025" data-y="0.89" cx="475.2288906629974" cy="228.31864788400765" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.1" data-x="2.4" data-y="-0.8899999999999999" cx="410.8459186714298" cy="411.68135211599235" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.2" data-x="1.8" data-y="-0.8899999999999999" cx="349.0382655595248" cy="411.68135211599235" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_GREEN.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="4.105" data-y="-0.89" cx="586.4826662644264" cy="411.68135211599235" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_GREEN.2" data-x="3.025" data-y="-0.8899999999999998" cx="475.2288906629974" cy="411.68135211599235" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":103.01275518650826,"c":0,"e":163.61530622380994,"b":0,"d":-103.01275518650826,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>