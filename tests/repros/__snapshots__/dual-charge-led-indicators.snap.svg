" y="134.87091933661492" width="117.76405131147942" height="112.77404913726426" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.010020035714285716"/></g><g><rect data-type="rect" data-label="R4" data-x="2.19" data-y="-1.19" x="344.3901326271292" y="442.7540534856947" width="67.86402956932716" height="59.88002609058282" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.010020035714285716"/></g><g><rect data-type="rect" data-label="CHG_GREEN" data-x="3.7399999999999998" data-y="-0.9499999999999997" x="474.13018915672524" y="392.3550315261209" width="117.76405131147953" height="112.77404913726423" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.010020035714285716"/></g><text data-type="text" data-label="IC1" data-x="0" data-y="0" x="159.7600521811656" y="353.93201478466364" fill="black" font-size="34.93001521950663" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">IC1</text><text data-type="text" data-label="R3" data-x="2.2" data-y="0.10000000000000009" x="379.32014784663585" y="343.95201043623314" fill="black" font-size="13.173605739928215" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R3</text><text data-type="text" data-label="CHG_RED" data-x="2.5" data-y="1.6300000000000001" x="409.2601608919272" y="191.25794390524703" fill="black" font-size="24.810290810198136" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">CHG_RED</text><text data-type="text" data-label="R4" data-x="2.19" data-y="-1.19" x="378.3221474117928" y="472.69406653098616" fill="black" font-size="13.173605739928215" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R4</text><text data-type="text" data-label="CHG_GREEN" data-x="3.7399999999999998" data-y="-0.9499999999999997" x="533.012214812465" y="448.742056094753" fill="black" font-size="24.810290810198136" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">CHG_GREEN</text><g><circle data-type="point" data-label="IC1.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="40" cy="323.99200173937226" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="40" cy="343.9520104362332" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="40" cy="363.9120191330941" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="40" cy="383.872027829955" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="279.5201043623312" cy="383.872027829955" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="279.5201043623312" cy="363.9120191330941" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="279.5201043623312" cy="343.9520104362332" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="279.5201043623312" cy="323.99200173937226" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.1" data-x="2.5" data-y="0.10000000000000005" cx="409.2601608919272" cy="343.9520104362332" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.2" data-x="1.9000000000000001" data-y="0.10000000000000013" cx="349.38013480134447" cy="343.95201043623314" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_RED.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="2.5" data-y="2.17" cx="409.2601608919272" cy="137.36592042372254" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_RED.2" data-x="2.5" data-y="1.09" cx="409.2601608919272" cy="245.14996738677155" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.1" data-x="2.19" data-y="-1.49" cx="378.3221474117928" cy="502.6340795762776" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.2" data-x="2.19" data-y="-0.8899999999999999" cx="378.3221474117928" cy="442.7540534856948" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_GREEN.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="3.7399999999999998" data-y="-0.4099999999999997" cx="533.012214812465" cy="394.8500326132285" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_GREEN.2" data-x="3.7399999999999998" data-y="-1.4899999999999998" cx="533.012214812465" cy="502.63407957627754" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":99.80004348430465,"c":0,"e":159.7600521811656,"b":0,"d":-99.80004348430465,"f":353.93201478466364};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
