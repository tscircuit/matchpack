01" height="95.86106810559261" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.011787892857142856"/></g><g><rect data-type="rect" data-label="R4" data-x="4.7299999999999995" data-y="0.39999999999999997" x="514.215372309967" y="333.99741259948917" width="57.68630647062196" height="50.89968217996068" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.011787892857142856"/></g><g><rect data-type="rect" data-label="CHG_GREEN" data-x="4.7299999999999995" data-y="1.865" x="493.00717140165006" y="187.23666231393588" width="100.10270828725595" height="95.86106810559258" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.011787892857142856"/></g><text data-type="text" data-label="IC1" data-x="0" data-y="0" x="141.79936435992136" y="393.38037514277664" fill="black" font-size="29.691481271643728" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">IC1</text><text data-type="text" data-label="R3" data-x="2.35" data-y="0.6" x="341.1564528981007" y="342.48069296281597" fill="black" font-size="11.19793007959135" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R3</text><text data-type="text" data-label="CHG_RED" data-x="2.35" data-y="2.065" x="341.1564528981007" y="218.20063564007864" fill="black" font-size="21.089434983230376" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">CHG_RED</text><text data-type="text" data-label="R4" data-x="4.7299999999999995" data-y="0.39999999999999997" x="543.058525545278" y="359.4472536894695" fill="black" font-size="11.19793007959135" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R4</text><text data-type="text" data-label="CHG_GREEN" data-x="4.7299999999999995" data-y="1.865" x="543.058525545278" y="235.16719636673218" fill="black" font-size="21.089434983230376" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">CHG_GREEN</text><g><circle data-type="point" data-label="IC1.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="39.999999999999986" cy="367.9305340527963" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="39.999999999999986" cy="384.89709477944984" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="39.999999999999986" cy="401.86365550610344" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="39.999999999999986" cy="418.830216232757" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="243.5987287198427" cy="418.830216232757" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="243.5987287198427" cy="401.86365550610344" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="243.5987287198427" cy="384.89709477944984" r="3" fill="black"/></g><g><circle data-type="point" data-label="IC1.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="243.5987287198427" cy="367.9305340527963" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.1" data-x="2.35" data-y="0.8999999999999999" cx="341.1564528981007" cy="317.0308518728356" r="3" fill="black"/></g><g><circle data-type="point" data-label="R3.2" data-x="2.35" data-y="0.3" cx="341.1564528981007" cy="367.9305340527963" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_RED.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="2.35" data-y="2.605" cx="341.1564528981007" cy="172.390921678114" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_RED.2" data-x="2.35" data-y="1.525" cx="341.1564528981007" cy="264.0103496020432" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.1" data-x="4.7299999999999995" data-y="0.7" cx="543.058525545278" cy="333.99741259948917" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.2" data-x="4.7299999999999995" data-y="0.09999999999999998" cx="543.058525545278" cy="384.89709477944984" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_GREEN.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="4.7299999999999995" data-y="2.4050000000000002" cx="543.058525545278" cy="189.35748240476755" r="3" fill="black"/></g><g><circle data-type="point" data-label="CHG_GREEN.2" data-x="4.7299999999999995" data-y="1.325" cx="543.058525545278" cy="280.9769103286968" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":84.8328036332678,"c":0,"e":141.79936435992136,"b":0,"d":-84.8328036332678,"f":393.38037514277664};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>