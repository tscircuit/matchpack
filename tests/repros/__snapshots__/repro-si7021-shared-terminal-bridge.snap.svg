xt" data-label="U1" data-x="0" data-y="0" x="514.8387096774194" y="439.11290322580646" fill="black" font-size="32.64516129032258" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="C2" data-x="-2.0300000000000002" data-y="0" x="138.3064516129033" y="439.11290322580646" fill="black" font-size="21.627419354838707" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="R1" data-x="2.15" data-y="0.4" x="913.6290322580644" y="364.9193548387097" fill="black" font-size="20.40322580645161" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="1.25" data-y="0.4" x="746.6935483870968" y="364.9193548387097" fill="black" font-size="20.40322580645161" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="1.7" data-y="1.6" x="830.1612903225806" y="142.33870967741944" fill="black" font-size="24.483870967741932" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1 (GND)" data-x="-1" data-y="0.2" cx="329.3548387096775" cy="402.0161290322581" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (V3_3)" data-x="-1" data-y="0" cx="329.3548387096775" cy="439.11290322580646" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="-0.2" cx="700.3225806451612" cy="476.2096774193548" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="0.2" cx="700.3225806451612" cy="402.0161290322581" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (GND)" data-x="-2.5600000000000005" data-y="3.245314017740486e-17" cx="40.00000000000006" cy="439.11290322580646" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (V3_3)" data-x="-1.5000000000000002" data-y="-3.245314017740486e-17" cx="236.61290322580652" cy="439.11290322580646" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="2.15" data-y="-0.09999999999999998" cx="913.6290322580644" cy="457.66129032258067" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="2.15" data-y="0.9" cx="913.6290322580644" cy="272.1774193548388" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="1.25" data-y="-0.09999999999999998" cx="746.6935483870968" cy="457.66129032258067" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="1.25" data-y="0.9" cx="746.6935483870968" cy="272.1774193548388" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="1.4" data-y="1.6" cx="774.516129032258" cy="142.33870967741944" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="1.7" data-y="1.9000000000000001" cx="830.1612903225806" cy="86.69354838709683" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="2" data-y="1.6" cx="885.8064516129032" cy="142.33870967741944" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":185.4838709677419,"c":0,"e":514.8387096774194,"b":0,"d":-185.4838709677419,"f":439.11290322580646};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>