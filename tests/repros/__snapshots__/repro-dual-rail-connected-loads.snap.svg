25" data-y="-1.9500000000000002" x="544.4111476575122" y="374.281098546042" width="35.18416672051694" height="99.51534733441031" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.01105357142857143"/></g><g><rect data-type="rect" data-label="C1" data-x="2.825" data-y="-0.2500000000000001" x="524.0064620355413" y="220.48465266558966" width="75.99353796445871" height="99.51534733441036" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.01105357142857143"/></g><g><rect data-type="rect" data-label="U1" data-x="0" data-y="0" x="234.05492730210017" y="166.20355411954768" width="144.7495961227787" height="162.84329563812597" fill="rgba(245, 158, 11, 0.18)" stroke="none" stroke-width="0.01105357142857143"/></g><text data-type="text" data-label="R1" data-x="-2.6750000000000003" data-y="-0.25000000000000044" x="64.42649434571891" y="270.24232633279485" fill="black" font-size="7.740516678513711" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="D1" data-x="-2.6750000000000003" data-y="-1.9200000000000004" x="64.42649434571891" y="421.3247172859451" fill="black" font-size="10.747657512116316" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">D1</text><text data-type="text" data-label="R2" data-x="2.825" data-y="-1.9500000000000002" x="562.0032310177706" y="424.03877221324717" fill="black" font-size="7.740516678513711" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="C1" data-x="2.825" data-y="-0.2500000000000001" x="562.0032310177706" y="270.24232633279485" fill="black" font-size="16.718578352180934" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C1</text><text data-type="text" data-label="U1" data-x="0" data-y="0" x="306.4297253634895" y="247.62520193861064" fill="black" font-size="31.663974151857833" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><g><circle data-type="point" data-label="R1.1" data-x="-2.6750000000000003" data-y="0.2999999999999996" cx="64.42649434571891" cy="220.4846526655897" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="-2.6750000000000003" data-y="-0.8000000000000005" cx="64.42649434571891" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="-2.6750000000000003" data-y="-1.4000000000000004" cx="64.42649434571891" cy="374.281098546042" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-2.6750000000000003" data-y="-2.4400000000000004" cx="64.42649434571891" cy="468.3683360258482" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1" data-x="2.825" data-y="-1.4000000000000001" cx="562.0032310177706" cy="374.281098546042" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="2.825" data-y="-2.5" cx="562.0032310177706" cy="473.7964458804523" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="2.825" data-y="0.29999999999999993" cx="562.0032310177706" cy="220.48465266558964" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="2.825" data-y="-0.8000000000000002" cx="562.0032310177706" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="197.8675282714055" cy="220.48465266558964" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="197.8675282714055" cy="238.57835218093697" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="197.8675282714055" cy="256.6720516962843" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="197.8675282714055" cy="274.76575121163165" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="414.99192245557356" cy="274.76575121163165" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="414.99192245557356" cy="256.6720516962843" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="414.99192245557356" cy="238.57835218093697" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="414.99192245557356" cy="220.48465266558964" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":90.46849757673667,"c":0,"e":306.4297253634895,"b":0,"d":-90.46849757673667,"f":247.62520193861064};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>