20.2227171492205" fill="black" font-size="43.65256124721603" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><g><circle data-type="point" data-label="R1.1" data-x="-1.9000000000000001" data-y="0.2999999999999998" cx="73.67483296213805" cy="182.80623608017822" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="-1.9000000000000001" data-y="-0.8000000000000003" cx="73.67483296213805" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="-1.9000000000000001" data-y="-1.4000000000000001" cx="73.67483296213805" cy="394.83296213808467" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-1.9000000000000001" data-y="-2.4400000000000004" cx="73.67483296213805" cy="524.543429844098" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1" data-x="1.9000000000000001" data-y="-1.4000000000000001" cx="547.6169265033407" cy="394.83296213808467" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="1.9000000000000001" data-y="-2.5" cx="547.6169265033407" cy="532.0267260579064" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="1.9000000000000001" data-y="0.2999999999999998" cx="547.6169265033407" cy="182.80623608017822" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="1.9000000000000001" data-y="-0.8000000000000003" cx="547.6169265033407" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="160.9799554565701" cy="182.80623608017817" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="160.9799554565701" cy="207.75055679287306" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="160.9799554565701" cy="232.69487750556794" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="160.9799554565701" cy="257.63919821826283" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="460.31180400890867" cy="257.63919821826283" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="460.31180400890867" cy="232.69487750556794" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="460.31180400890867" cy="207.75055679287306" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="460.31180400890867" cy="182.80623608017817" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":124.72160356347437,"c":0,"e":310.6458797327394,"b":0,"d":-124.72160356347437,"f":220.2227171492205};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>