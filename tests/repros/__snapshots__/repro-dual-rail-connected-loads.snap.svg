 data-x="1.0103336092965664e-16" data-y="-2.1049999999999995" cx="266.45994832041345" cy="329.88802756244615" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="-1.0103336092965664e-16" data-y="-3.205" cx="266.45994832041345" cy="436.003445305771" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="9.552245033349355e-17" data-y="-3.8049999999999993" cx="266.45994832041345" cy="493.8845822566753" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-9.552245033349355e-17" data-y="-4.844999999999999" cx="266.45994832041345" cy="594.2118863049095" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1" data-x="1.89" data-y="-3.804999999999999" cx="448.7855297157623" cy="493.8845822566753" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="1.89" data-y="-4.9049999999999985" cx="448.7855297157623" cy="600" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="1.89" data-y="-2.1049999999999986" cx="448.7855297157623" cy="329.8880275624461" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="1.89" data-y="-3.204999999999999" cx="448.7855297157623" cy="436.00344530577087" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="150.6976744186046" cy="97.88113695090436" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="150.6976744186046" cy="117.1748492678725" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="150.6976744186046" cy="136.46856158484064" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="150.6976744186046" cy="155.76227390180878" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="382.2222222222223" cy="155.76227390180878" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="382.2222222222223" cy="136.46856158484064" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="382.2222222222223" cy="117.1748492678725" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="382.2222222222223" cy="97.88113695090436" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":96.46856158484069,"c":0,"e":266.45994832041345,"b":0,"d":-96.46856158484069,"f":126.82170542635657};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>