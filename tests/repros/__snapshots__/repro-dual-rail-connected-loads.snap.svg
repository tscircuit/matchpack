chor="middle" dominant-baseline="central">U1</text><g><circle data-type="point" data-label="R1.1" data-x="-2.6750000000000003" data-y="0.09999999999999959" cx="64.42649434571891" cy="229.53150242326333" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="-2.6750000000000003" data-y="-1.0000000000000004" cx="64.42649434571891" cy="329.04684975767367" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="-2.6750000000000003" data-y="-1.6000000000000005" cx="64.42649434571891" cy="383.3279483037157" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-2.6750000000000003" data-y="-2.6400000000000006" cx="64.42649434571891" cy="477.4151857835218" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1" data-x="2.825" data-y="-1.6000000000000003" cx="562.0032310177706" cy="383.32794830371563" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="2.825" data-y="-2.7" cx="562.0032310177706" cy="482.843295638126" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="2.825" data-y="0.09999999999999992" cx="562.0032310177706" cy="229.5315024232633" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="2.825" data-y="-1.0000000000000002" cx="562.0032310177706" cy="329.04684975767367" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="197.8675282714055" cy="211.43780290791597" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="197.8675282714055" cy="229.5315024232633" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="197.8675282714055" cy="247.62520193861064" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="197.8675282714055" cy="265.718901453958" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="414.99192245557356" cy="265.718901453958" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="414.99192245557356" cy="247.62520193861064" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="414.99192245557356" cy="229.5315024232633" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="414.99192245557356" cy="211.43780290791597" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":90.46849757673667,"c":0,"e":306.4297253634895,"b":0,"d":-90.46849757673667,"f":238.57835218093697};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>