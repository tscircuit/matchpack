 data-x="1.9000000000000001" data-y="-2.15" x="523.364143429844" y="407.305122494432" width="48.50556614699315" height="137.1937639198219" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.008017857142857144"/></g><g><rect data-type="rect" data-label="C1" data-x="1.9000000000000001" data-y="-0.45" x="495.23385300668144" y="195.27839643652564" width="104.7661469933185" height="137.19376391982183" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.008017857142857144"/></g><g><rect data-type="rect" data-label="U1" data-x="0" data-y="0" x="210.8685968819599" y="95.50111358574611" width="199.554565701559" height="224.4988864142539" fill="rgba(245, 158, 11, 0.18)" stroke="none" stroke-width="0.008017857142857144"/></g><text data-type="text" data-label="R1" data-x="-1.9000000000000001" data-y="-0.45" x="73.67483296213805" y="263.87527839643656" fill="black" font-size="10.671224552338503" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="D1" data-x="-1.9000000000000001" data-y="-2.12" x="73.67483296213805" y="472.1603563474387" fill="black" font-size="14.816926503340756" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">D1</text><text data-type="text" data-label="R2" data-x="1.9000000000000001" data-y="-2.15" x="547.6169265033407" y="475.90200445434294" fill="black" font-size="10.671224552338503" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="C1" data-x="1.9000000000000001" data-y="-0.45" x="547.6169265033407" y="263.87527839643656" fill="black" font-size="23.04855233853006" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C1</text><text data-type="text" data-label="U1" data-x="0" data-y="0" x="310.6458797327394" y="207.75055679287306" fill="black" font-size="43.65256124721603" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><g><circle data-type="point" data-label="R1.1" data-x="-1.9000000000000001" data-y="0.10000000000000003" cx="73.67483296213805" cy="195.2783964365256" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="-1.9000000000000001" data-y="-1" cx="73.67483296213805" cy="332.47216035634744" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="-1.9000000000000001" data-y="-1.6" cx="73.67483296213805" cy="407.30512249443206" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-1.9000000000000001" data-y="-2.64" cx="73.67483296213805" cy="537.0155902004454" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1" data-x="1.9000000000000001" data-y="-1.5999999999999999" cx="547.6169265033407" cy="407.305122494432" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="1.9000000000000001" data-y="-2.7" cx="547.6169265033407" cy="544.4988864142539" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="1.9000000000000001" data-y="0.10000000000000003" cx="547.6169265033407" cy="195.2783964365256" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="1.9000000000000001" data-y="-1" cx="547.6169265033407" cy="332.47216035634744" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="160.9799554565701" cy="170.33407572383072" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="160.9799554565701" cy="195.2783964365256" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="160.9799554565701" cy="220.2227171492205" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="160.9799554565701" cy="245.1670378619154" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="460.31180400890867" cy="245.1670378619154" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="460.31180400890867" cy="220.2227171492205" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="460.31180400890867" cy="195.2783964365256" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="460.31180400890867" cy="170.33407572383072" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":124.72160356347437,"c":0,"e":310.6458797327394,"b":0,"d":-124.72160356347437,"f":207.75055679287306};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>