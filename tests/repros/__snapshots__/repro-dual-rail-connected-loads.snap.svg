nant-baseline="central">U1</text><g><circle data-type="point" data-label="R1.1" data-x="-1.9000000000000001" data-y="0.29999999999999977" cx="195.840796765482" cy="299.58417509622507" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="-3" data-y="0.2999999999999999" cx="120.98277211830725" cy="299.58417509622507" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="-3.9200000000000004" data-y="0.2999999999999994" cx="58.37424241339744" cy="299.5841750962251" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-3.9200000000000004" data-y="-0.7400000000000007" cx="58.37424241339744" cy="370.35903476264485" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1" data-x="3.84445535" data-y="0.2999999999999996" cx="586.7667787426592" cy="299.58417509622507" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="3.84445535" data-y="-0.8000000000000005" cx="586.7667787426592" cy="374.44219974339984" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="1.9000000000000001" data-y="0.2999999999999998" cx="454.4412455466312" cy="299.58417509622507" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="3" data-y="0.2999999999999998" cx="529.2992701938059" cy="299.58417509622507" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="243.47772154095685" cy="299.58417509622507" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="243.47772154095685" cy="313.19472503207504" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="243.47772154095685" cy="326.80527496792496" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="243.47772154095685" cy="340.41582490377493" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="406.8043207711563" cy="340.41582490377493" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="406.8043207711563" cy="326.80527496792496" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="406.8043207711563" cy="313.19472503207504" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="406.8043207711563" cy="299.58417509622507" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":68.05274967924977,"c":0,"e":325.1410211560566,"b":0,"d":-68.05274967924977,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>