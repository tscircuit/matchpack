 cx="428.20634996932773" cy="405.8968250153361" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_SWCLK.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net7)" data-x="4.98375" data-y="-0.8943750000000001" cx="556.1873005533232" cy="390.0404838650593" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_GND.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-4.417660699999999" data-y="-0.8943750000000001" cx="56.15551739839529" cy="390.0404838650593" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_SWDIO.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net8)" data-x="-2.090160699999999" data-y="-0.8943750000000001" cx="179.94800050873263" cy="390.0404838650593" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_3V3.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-2.057227675000001" data-y="-0.8943750000000001" cx="181.6996056391664" cy="390.0404838650593" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":53.186888554387686,"c":0,"e":291.1171447203935,"b":0,"d":-53.186888554387686,"f":342.4714604142288};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
