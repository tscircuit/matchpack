.01030769230769231"/></g><text data-type="text" data-label="U1" data-x="0" data-y="0" x="288.3582089552239" y="406.7164179104477" fill="black" font-size="17.074626865671643" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="C2" data-x="-2.0300000000000002" data-y="0" x="91.41791044776122" y="406.7164179104477" fill="black" font-size="11.311940298507462" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="R1" data-x="1.65" data-y="1.1" x="448.43283582089555" y="299.99999999999994" fill="black" font-size="10.671641791044776" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="2.55" data-y="1.1" x="535.7462686567164" y="299.99999999999994" fill="black" font-size="10.671641791044776" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="2.0999999999999996" data-y="2.3" x="492.08955223880594" y="183.5820895522388" fill="black" font-size="12.805970149253731" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1 (GND)" data-x="-1" data-y="0.2" cx="191.3432835820896" cy="387.31343283582083" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (V3_3)" data-x="-1" data-y="0" cx="191.3432835820896" cy="406.7164179104477" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="-0.2" cx="385.3731343283582" cy="426.1194029850746" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="0.2" cx="385.3731343283582" cy="387.31343283582083" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (GND)" data-x="-2.5600000000000005" data-y="3.245314017740486e-17" cx="40" cy="406.7164179104477" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (V3_3)" data-x="-1.5000000000000002" data-y="-3.245314017740486e-17" cx="142.8358208955224" cy="406.7164179104477" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="1.65" data-y="0.6000000000000001" cx="448.43283582089555" cy="348.5074626865671" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="1.65" data-y="1.6" cx="448.43283582089555" cy="251.4925373134328" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="2.55" data-y="0.6000000000000001" cx="535.7462686567164" cy="348.5074626865671" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="2.55" data-y="1.6" cx="535.7462686567164" cy="251.4925373134328" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="1.7999999999999996" data-y="2.3" cx="462.98507462686564" cy="183.5820895522388" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="2.0999999999999996" data-y="2.5999999999999996" cx="492.08955223880594" cy="154.47761194029852" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="2.3999999999999995" data-y="2.3" cx="521.1940298507462" cy="183.5820895522388" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="600" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":97.01492537313432,"c":0,"e":288.3582089552239,"b":0,"d":-97.01492537313432,"f":406.7164179104477};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>