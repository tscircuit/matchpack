 data-y="-0.7999999999999999" cx="305.6502242152466" cy="226.54708520179372" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP2.12 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net9)" data-x="0.8325" data-y="-1" cx="305.6502242152466" cy="240.8968609865471" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP2.13 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net10)" data-x="0.8325" data-y="-1.2" cx="305.6502242152466" cy="255.24663677130047" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net24)" data-x="1.2325" data-y="-3.004999999999999" cx="334.3497757847533" cy="384.7533632286995" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net39)" data-x="1.2325" data-y="-3.204999999999999" cx="334.3497757847533" cy="399.10313901345285" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.3 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="1.2325" data-y="-3.4049999999999994" cx="334.3497757847533" cy="413.4529147982063" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.4 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net23)" data-x="1.2325" data-y="-3.6049999999999995" cx="334.3497757847533" cy="427.80269058295966" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.5 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="1.2325" data-y="-3.8049999999999993" cx="334.3497757847533" cy="442.152466367713" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.6 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net22)" data-x="1.2325" data-y="-4.004999999999999" cx="334.3497757847533" cy="456.50224215246635" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.7 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net21)" data-x="1.2325" data-y="-4.204999999999999" cx="334.3497757847533" cy="470.8520179372197" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.8 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net20)" data-x="1.2325" data-y="-4.404999999999999" cx="334.3497757847533" cy="485.2017937219731" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.9 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net19)" data-x="1.2325" data-y="-4.604999999999999" cx="334.3497757847533" cy="499.5515695067264" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.10 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net16)" data-x="1.2325" data-y="-4.804999999999999" cx="334.3497757847533" cy="513.9013452914799" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.11 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net18)" data-x="1.2325" data-y="-5.004999999999999" cx="334.3497757847533" cy="528.2511210762332" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.12 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net17)" data-x="1.2325" data-y="-5.204999999999999" cx="334.3497757847533" cy="542.6008968609865" r="3" fill="black"/></g><g><circle data-type="point" data-label="JP1.13 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net11)" data-x="1.2325" data-y="-5.404999999999999" cx="334.3497757847533" cy="556.9506726457399" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":71.74887892376682,"c":0,"e":245.91928251121072,"b":0,"d":-71.74887892376682,"f":169.14798206278027};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>