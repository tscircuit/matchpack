087591240876" width="69.4890510948905" height="61.31386861313865" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.009785714285714286"/></g><text data-type="text" data-label="U1" data-x="0" data-y="0" x="319.99999999999994" y="176.93430656934305" fill="black" font-size="13.489051094890513" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="C1" data-x="2.3200000000000003" data-y="-0.5" x="557.0802919708028" y="228.02919708029196" fill="black" font-size="13.48905109489051" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C1</text><text data-type="text" data-label="C2" data-x="-2.32" data-y="-0.6000000000000001" x="82.91970802919707" y="238.24817518248173" fill="black" font-size="13.48905109489051" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="D1" data-x="-0.5" data-y="-1.3" x="268.90510948905103" y="309.7810218978102" fill="black" font-size="8.992700729927007" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">D1</text><text data-type="text" data-label="R1" data-x="-0.5" data-y="-2.8000000000000007" x="268.90510948905103" y="463.06569343065695" fill="black" font-size="13.48905109489051" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><g><circle data-type="point" data-label="U1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-1.1" data-y="0.1" cx="207.59124087591235" cy="166.71532846715326" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-1.1" data-y="-0.1" cx="207.59124087591235" cy="187.15328467153284" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="1.1" data-y="0" cx="432.4087591240875" cy="176.93430656934305" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="2.3200000000000003" data-y="-0.2" cx="557.0802919708028" cy="197.3722627737226" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="2.3200000000000003" data-y="-0.8" cx="557.0802919708028" cy="258.6861313868613" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.32" data-y="-0.3000000000000001" cx="82.91970802919707" cy="207.5912408759124" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-2.32" data-y="-0.9000000000000001" cx="82.91970802919707" cy="268.9051094890511" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="-0.5000000000000001" data-y="-2.3" cx="268.90510948905103" cy="411.970802919708" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-0.49999999999999994" data-y="-0.30000000000000004" cx="268.90510948905103" cy="207.5912408759124" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="-0.49999999999999994" data-y="-2.500000000000001" cx="268.90510948905103" cy="432.4087591240876" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-0.5" data-y="-3.1000000000000005" cx="268.90510948905103" cy="493.7226277372263" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":102.1897810218978,"c":0,"e":319.99999999999994,"b":0,"d":-102.1897810218978,"f":176.93430656934305};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
