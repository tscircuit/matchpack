<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-2.27,-0.8 -2.27,-1.4" data-type="line" data-label="" points="100.46272493573264,320 100.46272493573264,406.37532133676086" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="-1.2000000000000002,0.30000000000000004 -2.27,0.30000000000000004" data-type="line" data-label="" points="254.49871465295627,161.64524421593825 100.46272493573264,161.64524421593825" fill="none" stroke="black" stroke-width="1px"/></g><g><rect data-type="rect" data-label="R1" data-x="-2.27" data-y="-1.95" x="72.4691526992288" y="406.37532133676086" width="55.987144473007675" height="158.3547557840618" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.006946428571428571"/></g><g><rect data-type="rect" data-label="C1" data-x="-2.27" data-y="-0.25" x="40" y="161.64524421593825" width="120.92544987146528" height="158.35475578406175" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.006946428571428571"/></g><g><rect data-type="rect" data-label="no" data-x="0" data-y="0" x="312.0822622107969" y="75.26992287917733" width="230.33419023136253" height="259.1259640102828" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.006946428571428571"/></g><text data-type="text" data-label="R1" data-x="-2.27" data-y="-1.95" x="100.46272493573264" y="485.55269922879177" fill="black" font-size="12.317171784061665" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="C1" data-x="-2.27" data-y="-0.25" x="100.46272493573264" y="240.82262210796912" fill="black" font-size="26.603598971722366" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C1</text><text data-type="text" data-label="no" data-x="0" data-y="0" x="427.24935732647816" y="204.83290488431874" fill="black" font-size="50.38560411311054" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">no</text><g><circle data-type="point" data-label="R1.1" data-x="-2.27" data-y="-1.4" cx="100.46272493573264" cy="406.37532133676086" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-2.27" data-y="-2.5" cx="100.46272493573264" cy="564.7300771208227" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-2.27" data-y="0.30000000000000004" cx="100.46272493573264" cy="161.64524421593825" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="-2.27" data-y="-0.8" cx="100.46272493573264" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="254.49871465295627" cy="161.64524421593825" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="254.49871465295627" cy="190.43701799485856" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="254.49871465295627" cy="219.22879177377888" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="254.49871465295627" cy="248.02056555269922" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="600" cy="248.02056555269922" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="600" cy="219.2287917737789" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="600" cy="190.4370179948586" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="600" cy="161.64524421593825" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":143.95886889460155,"c":0,"e":427.24935732647816,"b":0,"d":-143.95886889460155,"f":204.83290488431874};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>