<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-2.825000000000001,-0.9999999999999998 -2.825000000000001,-1.5999999999999999" data-type="line" data-label="" points="92.91338582677167,332.59842519685037 92.91338582677167,408.1889763779527" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="-1.2000000000000002,0.30000000000000004 -2.825000000000001,0.10000000000000037" data-type="line" data-label="" points="297.63779527559063,168.81889763779532 92.91338582677167,194.01574803149606" fill="none" stroke="black" stroke-width="1px"/></g><g><rect data-type="rect" data-label="R1" data-x="-2.825000000000001" data-y="-2.15" x="68.41507401574808" y="408.1889763779527" width="48.996623622047196" height="138.5826771653543" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.007937500000000002"/></g><g><rect data-type="rect" data-label="C1" data-x="-2.825000000000001" data-y="-0.4499999999999997" x="40.00000000000006" y="194.01574803149606" width="105.82677165354323" height="138.5826771653543" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.007937500000000002"/></g><g><rect data-type="rect" data-label="no" data-x="0" data-y="0" x="348.03149606299223" y="93.22834645669298" width="201.57480314960623" height="226.77165354330702" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.007937500000000002"/></g><text data-type="text" data-label="R1" data-x="-2.825000000000001" data-y="-2.15" x="92.91338582677167" y="477.48031496062987" fill="black" font-size="10.779257196850363" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="C1" data-x="-2.825000000000001" data-y="-0.4499999999999997" x="92.91338582677167" y="263.3070866141732" fill="black" font-size="23.28188976377952" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C1</text><text data-type="text" data-label="no" data-x="0" data-y="0" x="448.8188976377953" y="206.6141732283465" fill="black" font-size="44.094488188976364" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">no</text><g><circle data-type="point" data-label="R1.1" data-x="-2.825000000000001" data-y="-1.5999999999999999" cx="92.91338582677167" cy="408.1889763779527" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-2.825000000000001" data-y="-2.7" cx="92.91338582677167" cy="546.771653543307" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-2.825000000000001" data-y="0.10000000000000037" cx="92.91338582677167" cy="194.01574803149606" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="-2.825000000000001" data-y="-0.9999999999999998" cx="92.91338582677167" cy="332.59842519685037" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="297.63779527559063" cy="168.81889763779532" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="297.63779527559063" cy="194.0157480314961" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="297.63779527559063" cy="219.2125984251969" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="297.63779527559063" cy="244.40944881889766" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="600" cy="244.40944881889766" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="600" cy="219.2125984251969" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="600" cy="194.0157480314961" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="600" cy="168.81889763779532" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":125.9842519685039,"c":0,"e":448.8188976377953,"b":0,"d":-125.9842519685039,"f":206.6141732283465};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>