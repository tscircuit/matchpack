black" font-size="33.76399655469423" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">no</text><g><circle data-type="point" data-label="R1.1" data-x="1.0103336092965664e-16" data-y="-3.8049999999999997" cx="320" cy="493.8845822566753" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-1.0103336092965664e-16" data-y="-4.904999999999999" cx="320" cy="600" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="1.0103336092965664e-16" data-y="-2.1049999999999995" cx="320" cy="329.88802756244615" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="-1.0103336092965664e-16" data-y="-3.204999999999999" cx="320" cy="436.00344530577087" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="204.2377260981912" cy="97.88113695090442" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="204.2377260981912" cy="117.17484926787256" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="204.2377260981912" cy="136.4685615848407" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="204.2377260981912" cy="155.76227390180884" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="435.76227390180884" cy="155.76227390180884" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="435.76227390180884" cy="136.4685615848407" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="435.76227390180884" cy="117.17484926787256" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="435.76227390180884" cy="97.88113695090442" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":96.46856158484066,"c":0,"e":320,"b":0,"d":-96.46856158484066,"f":126.82170542635663};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>