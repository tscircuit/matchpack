<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-2.825000000000001,-0.7999999999999997 -2.825000000000001,-1.3999999999999997" data-type="line" data-label="" points="92.91338582677167,319.99999999999994 92.91338582677167,395.5905511811023" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="-1.2000000000000002,0.30000000000000004 -2.825000000000001,0.3000000000000004" data-type="line" data-label="" points="297.63779527559063,181.4173228346457 92.91338582677167,181.41732283464563" fill="none" stroke="black" stroke-width="1px"/></g><g><rect data-type="rect" data-label="R1" data-x="-2.825000000000001" data-y="-1.9499999999999997" x="68.41507401574808" y="395.5905511811022" width="48.996623622047196" height="138.58267716535437" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.007937500000000002"/></g><g><rect data-type="rect" data-label="C1" data-x="-2.825000000000001" data-y="-0.24999999999999967" x="40.00000000000006" y="181.41732283464563" width="105.82677165354323" height="138.5826771653543" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.007937500000000002"/></g><g><rect data-type="rect" data-label="no" data-x="0" data-y="0" x="348.03149606299223" y="105.82677165354335" width="201.57480314960623" height="226.77165354330702" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.007937500000000002"/></g><text data-type="text" data-label="R1" data-x="-2.825000000000001" data-y="-1.9499999999999997" x="92.91338582677167" y="464.88188976377944" fill="black" font-size="10.779257196850363" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="C1" data-x="-2.825000000000001" data-y="-0.24999999999999967" x="92.91338582677167" y="250.7086614173228" fill="black" font-size="23.28188976377952" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C1</text><text data-type="text" data-label="no" data-x="0" data-y="0" x="448.8188976377953" y="219.21259842519686" fill="black" font-size="44.094488188976364" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">no</text><g><circle data-type="point" data-label="R1.1" data-x="-2.825000000000001" data-y="-1.3999999999999997" cx="92.91338582677167" cy="395.5905511811023" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net2)" data-x="-2.825000000000001" data-y="-2.5" cx="92.91338582677167" cy="534.1732283464567" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-2.825000000000001" data-y="0.3000000000000004" cx="92.91338582677167" cy="181.41732283464563" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="-2.825000000000001" data-y="-0.7999999999999997" cx="92.91338582677167" cy="319.99999999999994" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.1" data-x="-1.2000000000000002" data-y="0.30000000000000004" cx="297.63779527559063" cy="181.4173228346457" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.2" data-x="-1.2000000000000002" data-y="0.10000000000000003" cx="297.63779527559063" cy="206.61417322834646" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.3" data-x="-1.2000000000000002" data-y="-0.09999999999999998" cx="297.63779527559063" cy="231.81102362204726" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.4" data-x="-1.2000000000000002" data-y="-0.30000000000000004" cx="297.63779527559063" cy="257.00787401574803" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.5" data-x="1.2000000000000002" data-y="-0.30000000000000004" cx="600" cy="257.00787401574803" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.6" data-x="1.2000000000000002" data-y="-0.10000000000000003" cx="600" cy="231.81102362204726" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.7" data-x="1.2000000000000002" data-y="0.09999999999999998" cx="600" cy="206.61417322834646" r="3" fill="black"/></g><g><circle data-type="point" data-label="no.8" data-x="1.2000000000000002" data-y="0.30000000000000004" cx="600" cy="181.4173228346457" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":125.9842519685039,"c":0,"e":448.8188976377953,"b":0,"d":-125.9842519685039,"f":219.21259842519686};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
