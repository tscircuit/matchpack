D2</text><g><circle data-type="point" data-label="U1.1" data-x="-1.9500000000000002" data-y="-0.7000000000000001" cx="173.72353673723535" cy="440.1992528019925" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.9500000000000002" data-y="-0.9" cx="173.72353673723535" cy="453.1506849315068" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="1.9500000000000002" data-y="-0.85" cx="426.27646326276465" cy="449.9128268991282" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.9500000000000002" data-y="-0.2499999999999999" cx="426.27646326276465" cy="411.05853051058523" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.9500000000000002" data-y="-0.44999999999999996" cx="426.27646326276465" cy="424.00996264009956" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="-0.44999999999999996" data-y="2.55" cx="270.8592777085928" cy="229.73848069738477" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="-1.9500000000000002" data-y="0.7" cx="173.72353673723535" cy="349.53922789539223" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.9" data-x="0.44999999999999996" data-y="2.55" cx="329.1407222914072" cy="229.73848069738477" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.10" data-x="1.9500000000000002" data-y="0.85" cx="426.27646326276465" cy="339.8256537982565" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.12" data-x="0" data-y="-2.55" cx="300" cy="560" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.13" data-x="-1.9500000000000002" data-y="0.9" cx="173.72353673723535" cy="336.5877957658779" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.14" data-x="1.9500000000000002" data-y="-0.6499999999999999" cx="426.27646326276465" cy="436.9613947696139" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.15" data-x="-0.65" data-y="-2.55" cx="257.90784557907847" cy="560" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.16" data-x="0.65" data-y="-2.55" cx="342.09215442092153" cy="560" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.1" data-x="-0.8899999999999999" data-y="4.88" cx="242.36612702366128" cy="78.85429638854293" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.2" data-x="-0.8899999999999999" data-y="5.4799999999999995" cx="242.36612702366128" cy="39.99999999999994" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="-0.8899999999999998" data-y="4.255000000000001" cx="242.36612702366128" cy="119.32752179327508" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2" data-x="-0.89" data-y="3.1750000000000003" cx="242.36612702366125" cy="189.26525529265248" r="3" fill="black"/></g><g><circle data-type="point" data-label="R5.1" data-x="0.8899999999999999" data-y="4.88" cx="357.63387297633875" cy="78.85429638854293" r="3" fill="black"/></g><g><circle data-type="point" data-label="R5.2" data-x="0.8899999999999999" data-y="5.4799999999999995" cx="357.63387297633875" cy="39.99999999999994" r="3" fill="black"/></g><g><circle data-type="point" data-label="D2.1" data-x="0.89" data-y="4.255000000000001" cx="357.63387297633875" cy="119.32752179327508" r="3" fill="black"/></g><g><circle data-type="point" data-label="D2.2" data-x="0.8899999999999998" data-y="3.1750000000000003" cx="357.6338729763387" cy="189.26525529265248" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="600" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":64.75716064757161,"c":0,"e":300,"b":0,"d":-64.75716064757161,"f":394.86924034869236};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>