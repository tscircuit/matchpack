x="-1.9500000000000002" data-y="-0.7000000000000001" cx="196.8463886063072" cy="462.1363173957273" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1.9500000000000002" data-y="-0.9" cx="196.8463886063072" cy="472.7161749745676" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="1.9500000000000002" data-y="-0.85" cx="403.1536113936928" cy="470.0712105798575" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.9500000000000002" data-y="-0.2499999999999999" cx="403.1536113936928" cy="438.3316378433367" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.9500000000000002" data-y="-0.44999999999999996" cx="403.1536113936928" cy="448.911495422177" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="-0.44999999999999996" data-y="2.55" cx="276.19532044760933" cy="290.21363173957263" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="-1.9500000000000002" data-y="0.7" cx="196.8463886063072" cy="388.07731434384533" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.9" data-x="0.44999999999999996" data-y="2.55" cx="323.80467955239067" cy="290.21363173957263" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.10" data-x="1.9500000000000002" data-y="0.85" cx="403.1536113936928" cy="380.1424211597151" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.12" data-x="0" data-y="-2.55" cx="300" cy="560" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.13" data-x="-1.9500000000000002" data-y="0.9" cx="196.8463886063072" cy="377.49745676500504" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.14" data-x="1.9500000000000002" data-y="-0.6499999999999999" cx="403.1536113936928" cy="459.4913530010173" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.15" data-x="-0.65" data-y="-2.55" cx="265.61546286876904" cy="560" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.16" data-x="0.65" data-y="-2.55" cx="334.38453713123096" cy="560" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.1" data-x="0.4499999999999998" data-y="7.2799999999999985" cx="323.8046795523906" cy="39.99999999999994" r="3" fill="black"/></g><g><circle data-type="point" data-label="R4.2" data-x="0.4499999999999997" data-y="6.679999999999999" cx="323.8046795523906" cy="71.73957273652081" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.1" data-x="-1.09" data-y="6.11" cx="242.33977619532044" cy="101.89216683621555" r="3" fill="black"/></g><g><circle data-type="point" data-label="D1.2" data-x="-1.09" data-y="5.03" cx="242.33977619532044" cy="159.0233977619531" r="3" fill="black"/></g><g><circle data-type="point" data-label="R5.1" data-x="0.44999999999999973" data-y="5.379999999999999" cx="323.8046795523906" cy="140.50864699898267" r="3" fill="black"/></g><g><circle data-type="point" data-label="R5.2" data-x="0.44999999999999973" data-y="5.979999999999999" cx="323.8046795523906" cy="108.7690742624618" r="3" fill="black"/></g><g><circle data-type="point" data-label="D2.1" data-x="0.2500000000000003" data-y="4.33" cx="313.2248219735504" cy="196.0528992878941" r="3" fill="black"/></g><g><circle data-type="point" data-label="D2.2" data-x="0.25000000000000006" data-y="3.25" cx="313.2248219735504" cy="253.18413021363165" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="600" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":52.899287894201436,"c":0,"e":300,"b":0,"d":-52.899287894201436,"f":425.1068158697863};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>