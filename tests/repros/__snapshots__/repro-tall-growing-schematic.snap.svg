x="166.02086438152014" cy="312.9061102831595" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="-2.2" data-y="0.08500000000000008" cx="332.93591654247393" cy="312.9061102831595" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="-2.2" data-y="0.2850000000000001" cx="332.93591654247393" cy="296.2146050670641" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="-2.2" data-y="0.4850000000000001" cx="332.93591654247393" cy="279.5230998509687" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="-2.2" data-y="0.6850000000000002" cx="332.93591654247393" cy="262.83159463487334" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.1 (VCC)" data-x="-1" data-y="0.30000000000000004" cx="433.0849478390462" cy="294.96274217585693" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.2 (GND)" data-x="-1" data-y="0.10000000000000003" cx="433.0849478390462" cy="311.6542473919523" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.3" data-x="-1" data-y="-0.09999999999999998" cx="433.0849478390462" cy="328.3457526080477" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.4" data-x="-1" data-y="-0.30000000000000004" cx="433.0849478390462" cy="345.03725782414307" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.5" data-x="1" data-y="-0.30000000000000004" cx="600" cy="345.03725782414307" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.6" data-x="1" data-y="-0.10000000000000003" cx="600" cy="328.3457526080477" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.7" data-x="1" data-y="0.09999999999999998" cx="600" cy="311.6542473919523" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.8" data-x="1" data-y="0.30000000000000004" cx="600" cy="294.96274217585693" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":83.4575260804769,"c":0,"e":516.5424739195231,"b":0,"d":-83.4575260804769,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>