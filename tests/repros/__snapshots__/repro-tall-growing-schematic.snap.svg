ta-label="C6.1" data-x="3.595" data-y="0.6850000000000002" cx="401.91279887482426" cy="266.0478199718706" r="3" fill="black"/></g><g><circle data-type="point" data-label="C6.2" data-x="3.595" data-y="-0.4149999999999999" cx="401.91279887482426" cy="352.68635724331926" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="2.71" data-y="1.2000000000000002" cx="332.2081575246132" cy="225.48523206751054" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="3.8100000000000005" data-y="1.2000000000000002" cx="418.8466947960619" cy="225.48523206751054" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="2.8649999999999998" data-y="0.6850000000000002" cx="344.41631504922645" cy="266.0478199718706" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2" data-x="2.8649999999999998" data-y="-0.4149999999999999" cx="344.41631504922645" cy="352.68635724331926" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.1" data-x="4.325" data-y="-0.3650000000000001" cx="459.40928270042195" cy="348.7482419127989" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.2 (GND)" data-x="4.325" data-y="-1.4650000000000003" cx="459.40928270042195" cy="435.38677918424753" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1 (VSYS)" data-x="4.11" data-y="0.6850000000000002" cx="442.4753867791843" cy="266.0478199718706" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (GND)" data-x="4.11" data-y="0.48500000000000015" cx="442.4753867791843" cy="281.80028129395214" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="4.11" data-y="0.28500000000000014" cx="442.4753867791843" cy="297.55274261603375" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (V3_3)" data-x="4.11" data-y="0.08500000000000008" cx="442.4753867791843" cy="313.3052039381153" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="6.11" data-y="0.08500000000000008" cx="600" cy="313.3052039381153" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="6.11" data-y="0.2850000000000001" cx="600" cy="297.55274261603375" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="6.11" data-y="0.4850000000000001" cx="600" cy="281.8002812939522" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="6.11" data-y="0.6850000000000002" cx="600" cy="266.0478199718706" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.1 (VCC)" data-x="-1" data-y="0.30000000000000004" cx="40" cy="296.3713080168776" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.2 (GND)" data-x="-1" data-y="0.10000000000000003" cx="40" cy="312.1237693389592" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.3" data-x="-1" data-y="-0.09999999999999998" cx="40" cy="327.8762306610408" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.4" data-x="-1" data-y="-0.30000000000000004" cx="40" cy="343.6286919831224" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.5" data-x="1" data-y="-0.30000000000000004" cx="197.52461322081575" cy="343.6286919831224" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.6" data-x="1" data-y="-0.10000000000000003" cx="197.52461322081575" cy="327.8762306610408" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.7" data-x="1" data-y="0.09999999999999998" cx="197.52461322081575" cy="312.1237693389592" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.8" data-x="1" data-y="0.30000000000000004" cx="197.52461322081575" cy="296.3713080168776" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":78.76230661040788,"c":0,"e":118.76230661040788,"b":0,"d":-78.76230661040788,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>