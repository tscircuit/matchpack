et5)" data-x="4.3925" data-y="1.6524999999999999" cx="324.5304937076476" cy="189.58373668925458" r="3" fill="black"/></g><g><circle data-type="point" data-label="R18.2 (CONTROLLER_connectivity_net45)" data-x="4.3925" data-y="1.0524999999999998" cx="324.5304937076476" cy="226.75701839303" r="3" fill="black"/></g><g><circle data-type="point" data-label="R19.1 (CONTROLLER_connectivity_net9)" data-x="4.7" data-y="-1.21" cx="343.5818005808325" cy="366.9312681510164" r="3" fill="black"/></g><g><circle data-type="point" data-label="R19.2 (CONTROLLER_connectivity_net45)" data-x="4.7" data-y="-1.81" cx="343.5818005808325" cy="404.10454985479186" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_VM.1 (CONTROLLER_connectivity_net3)" data-x="4.500000000000001" data-y="-2.7575" cx="331.1907066795741" cy="462.8073572120038" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_V3V3.1 (CONTROLLER_connectivity_net5)" data-x="1.5350000000000004" data-y="-2.7575" cx="147.49273959341724" cy="462.8073572120038" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_GND.1 (CONTROLLER_connectivity_net1)" data-x="8.135000000000002" data-y="-2.7575" cx="556.3988383349468" cy="462.8073572120038" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP_IMU_INT.1 (CONTROLLER_connectivity_net19)" data-x="6.2875000000000005" data-y="-2.7575" cx="441.93610842207164" cy="462.8073572120038" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":61.95546950629235,"c":0,"e":52.391093901258444,"b":0,"d":-61.95546950629235,"f":291.9651500484027};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
