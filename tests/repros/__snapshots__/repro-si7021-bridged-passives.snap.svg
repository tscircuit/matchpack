" font-size="21.261744966442954" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="C2" data-x="-2.0300000000000002" data-y="0" x="104.0268456375839" y="300" fill="black" font-size="14.085906040268458" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="R1" data-x="1.9" data-y="0.45" x="578.7919463087248" y="245.63758389261744" fill="black" font-size="13.288590604026846" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="1.9" data-y="-0.45" x="578.7919463087248" y="354.36241610738256" fill="black" font-size="13.288590604026846" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="3.0999999999999996" data-y="0" x="723.7583892617449" y="300" fill="black" font-size="15.946308724832216" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1 (GND)" data-x="-1" data-y="0.2" cx="228.45637583892625" cy="275.83892617449663" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (V3_3)" data-x="-1" data-y="0" cx="228.45637583892625" cy="300" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="-0.2" cx="470.0671140939598" cy="324.16107382550337" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="0.2" cx="470.0671140939598" cy="275.83892617449663" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (GND)" data-x="-2.5600000000000005" data-y="3.245314017740486e-17" cx="40" cy="300" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (V3_3)" data-x="-1.5000000000000002" data-y="-3.245314017740486e-17" cx="168.0536912751678" cy="300" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="1.4" data-y="0.45000000000000007" cx="518.3892617449665" cy="245.63758389261744" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="2.4" data-y="0.44999999999999996" cx="639.1946308724832" cy="245.63758389261744" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="1.4" data-y="-0.44999999999999996" cx="518.3892617449665" cy="354.36241610738256" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="2.4" data-y="-0.45000000000000007" cx="639.1946308724832" cy="354.36241610738256" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="3.0999999999999996" data-y="-0.3" cx="723.7583892617449" cy="336.241610738255" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="2.8" data-y="1.8369701987210297e-17" cx="687.5167785234901" cy="300" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="3.0999999999999996" data-y="0.3" cx="723.7583892617449" cy="263.758389261745" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":120.80536912751678,"c":0,"e":349.261744966443,"b":0,"d":-120.80536912751678,"f":300};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>