x="-2.469999999999999" data-y="1.0675000000000001" cx="192.51806716735157" cy="320.0529025553823" r="3" fill="black"/></g><g><circle data-type="point" data-label="C4.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-0.1983333333333324" data-y="2.813333333333333" cx="336.7304331396722" cy="209.22204902933254" r="3" fill="black"/></g><g><circle data-type="point" data-label="C4.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="-0.19833333333333233" data-y="2.2133333333333334" cx="336.7304331396722" cy="247.31188890463363" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="3.35875" data-y="1.5083333333333333" cx="562.5449907892872" cy="292.0674507581125" r="3" fill="black"/></g><g><circle data-type="point" data-label="DPWR.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net40)" data-x="3.35875" data-y="0.42833333333333323" cx="562.5449907892872" cy="360.6291625336545" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net40)" data-x="3.35875" data-y="-0.19666666666666682" cx="562.5449907892872" cy="400.3060790704265" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="3.35875" data-y="-0.7966666666666669" cx="562.5449907892872" cy="438.3959189457276" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="1.9866666666666681" data-y="2.813333333333333" cx="475.44093335222715" cy="209.22204902933254" r="3" fill="black"/></g><g><circle data-type="point" data-label="C18.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net33)" data-x="1.9866666666666681" data-y="2.2133333333333334" cx="475.44093335222715" cy="247.31188890463363" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":63.483066458835204,"c":0,"e":349.32124132067446,"b":0,"d":-63.483066458835204,"f":387.8210760001889};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>