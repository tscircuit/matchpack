it_source_group_0_connectivity_net1)" data-x="-1.15" data-y="-0.10000000000000009" cx="407.56129329687866" cy="328.36690029144006" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.11" data-x="-1.15" data-y="0.09999999999999987" cx="407.56129329687866" cy="311.63309970855994" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.12 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="1.15" data-y="0.30000000000000004" cx="600" cy="294.8992991256798" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.13 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="1.15" data-y="0.10000000000000009" cx="600" cy="311.63309970855994" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.14 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net5)" data-x="1.15" data-y="-0.09999999999999998" cx="600" cy="328.36690029144006" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-4.986371599999999" data-y="-0.35956670000000046" cx="86.57590671575508" cy="350.08458727022145" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-4.986668599999997" data-y="0.7" cx="86.55105702188968" cy="261.4316979599196" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-3.6099999999999994" data-y="0.4702166499999997" cx="201.73554612745323" cy="280.65744174075036" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-3.6099999999999994" data-y="-0.12978335000000027" cx="201.73554612745323" cy="330.85884348939067" r="3" fill="black"/></g><g><circle data-type="point" data-label="C3.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-2.37" data-y="0.4702166499999997" cx="305.4851097413099" cy="280.65744174075036" r="3" fill="black"/></g><g><circle data-type="point" data-label="C3.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-2.37" data-y="-0.12978335000000027" cx="305.4851097413099" cy="330.85884348939067" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":83.66900291440058,"c":0,"e":503.7806466484393,"b":0,"d":-83.66900291440058,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>