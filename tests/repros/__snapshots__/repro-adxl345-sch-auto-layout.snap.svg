ctivity_net1)" data-x="-1.15" data-y="-0.10000000000000009" cx="388.611274877195" cy="329.19081413577413" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.11" data-x="-1.15" data-y="0.09999999999999987" cx="388.611274877195" cy="310.80918586422587" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.12 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net3)" data-x="1.15" data-y="0.30000000000000004" cx="600" cy="292.4275575926776" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.13 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net4)" data-x="1.15" data-y="0.10000000000000009" cx="600" cy="310.80918586422587" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.14 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net5)" data-x="1.15" data-y="-0.09999999999999998" cx="600" cy="329.19081413577413" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-4.3863715999999995" data-y="-0.30637780000000026" cx="91.16237637821575" cy="348.1586141512738" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-4.3866685999999975" data-y="0.7531889000000002" cx="91.13507966023269" cy="250.77580810971833" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-3.0100000000000002" data-y="0.5234055499999999" cx="217.6621319517962" cy="271.8947687231737" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-3.0100000000000002" data-y="-0.07659445000000006" cx="217.6621319517962" cy="327.0396535378185" r="3" fill="black"/></g><g><circle data-type="point" data-label="C3.1 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net0)" data-x="-1.77" data-y="0.5234055499999999" cx="331.62822723539546" cy="271.8947687231737" r="3" fill="black"/></g><g><circle data-type="point" data-label="C3.2 (unnamedsubcircuitsubcircuit_source_group_0_connectivity_net1)" data-x="-1.77" data-y="-0.07659445000000006" cx="331.62822723539546" cy="327.0396535378185" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":91.90814135774129,"c":0,"e":494.3056374385975,"b":0,"d":-91.90814135774129,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>