></g><g><circle data-type="point" data-label="C_IN.1 (AP63203Reference_connectivity_net0)" data-x="-4.530859687921223" data-y="-1.8595027916666662" cx="158.00088477661137" cy="404.01125230134346" r="3" fill="black"/></g><g><circle data-type="point" data-label="C_IN.2 (AP63203Reference_connectivity_net1)" data-x="-4.530859687921223" data-y="-2.459502791666666" cx="158.00088477661137" cy="445.8020231027012" r="3" fill="black"/></g><g><circle data-type="point" data-label="C_BST.1" data-x="1.01747364541211" data-y="1.152836125" cx="544.4494292147218" cy="194.19797689729884" r="3" fill="black"/></g><g><circle data-type="point" data-label="C_BST.2" data-x="1.01747364541211" data-y="0.552836125" cx="544.4494292147218" cy="235.98874769865654" r="3" fill="black"/></g><g><circle data-type="point" data-label="C_OUT_A.1 (AP63203Reference_connectivity_net4)" data-x="-5.52252635458789" data-y="-0.1771638749999998" cx="88.93002747992296" cy="286.8341855069751" r="3" fill="black"/></g><g><circle data-type="point" data-label="C_OUT_A.2 (AP63203Reference_connectivity_net1)" data-x="-5.52252635458789" data-y="-0.7771638749999998" cx="88.93002747992296" cy="328.62495630833274" r="3" fill="black"/></g><g><circle data-type="point" data-label="C_OUT_B.1 (AP63203Reference_connectivity_net4)" data-x="-3.71752635458789" data-y="-0.1771638749999998" cx="214.65059630734066" cy="286.8341855069751" r="3" fill="black"/></g><g><circle data-type="point" data-label="C_OUT_B.2 (AP63203Reference_connectivity_net1)" data-x="-3.71752635458789" data-y="-0.7771638749999998" cx="214.65059630734066" cy="328.62495630833274" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":69.65128466892949,"c":0,"e":473.5810826949895,"b":0,"d":-69.65128466892949,"f":274.4944940162994};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
