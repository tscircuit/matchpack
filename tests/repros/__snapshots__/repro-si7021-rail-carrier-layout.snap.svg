<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="1,-0.2 1.4,-0.19999999999999998" data-type="line" data-label="" points="233.10341498216985,109.31034149821699 271.7240979786038,109.31034149821699" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1px"/></g><g><polyline data-points="1,0.2 2.800001,0.20000000000000004" data-type="line" data-label="" points="233.10341498216985,70.68965850178301 406.89658501783015,70.68965850178301" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1px"/></g><g><polyline data-points="2.800001,0.20000000000000004 1,0.2" data-type="line" data-label="" points="406.89658501783015,70.68965850178301 233.10341498216985,70.68965850178301" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="1.4,-0.19999999999999998 1,-0.2" data-type="line" data-label="" points="271.7240979786038,109.31034149821699 233.10341498216985,109.31034149821699" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="4.500001,0.3 3.800001,0.19999999999999998" data-type="line" data-label="" points="571.0344877526745,61.03448775267453 503.4482925089151,70.68965850178301" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="4.500001,-0.3 2.4,-0.20000000000000004" data-type="line" data-label="" points="571.0344877526745,118.96551224732548 368.2758054696887,109.31034149821699" fill="none" stroke="black" stroke-width="1px"/></g><g><rect data-type="rect" data-label="U1" data-x="0" data-y="0" x="78.62068299643397" y="51.37931700356603" width="115.8620489893019" height="77.24136599286794" fill="rgba(245, 158, 11, 0.18)" stroke="none" stroke-width="0.010357144642857143"/></g><g><rect data-type="rect" data-label="R1" data-x="3.300001" data-y="0.2" x="406.89658501783015" y="46.55173162901178" width="96.55170749108493" height="48.275853745542456" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.010357144642857143"/></g><g><rect data-type="rect" data-label="R2" data-x="1.9" data-y="-0.2" x="271.7240979786038" y="85.17241462544575" width="96.55170749108487" height="48.27585374554246" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.010357144642857143"/></g><g><rect data-type="rect" data-label="SJ1" data-x="4.500001" data-y="0" x="542.068975505349" y="61.03448775267452" width="57.931024494650956" height="57.93102449465095" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.010357144642857143"/></g><text data-type="text" data-label="U1" data-x="0" data-y="0" x="136.55170749108493" y="90" fill="black" font-size="16.993100518430946" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="R1" data-x="3.300001" data-y="0.2" x="455.1724387633726" y="70.68965850178301" fill="black" font-size="10.62068782401934" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="1.9" data-y="-0.2" x="319.9999517241463" y="109.31034149821699" fill="black" font-size="10.62068782401934" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="4.500001" data-y="0" x="571.0344877526745" y="90" fill="black" font-size="12.744825388823209" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1" data-x="-1" data-y="0.2" cx="40.000000000000014" cy="70.68965850178301" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="-1" data-y="0" cx="40.000000000000014" cy="90" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="-0.2" cx="233.10341498216985" cy="109.31034149821699" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="0.2" cx="233.10341498216985" cy="70.68965850178301" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="2.800001" data-y="0.20000000000000004" cx="406.89658501783015" cy="70.68965850178301" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="3.800001" data-y="0.19999999999999998" cx="503.4482925089151" cy="70.68965850178301" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="1.4" data-y="-0.19999999999999998" cx="271.7240979786038" cy="109.31034149821699" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="2.4" data-y="-0.20000000000000004" cx="368.2758054696887" cy="109.31034149821699" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="4.500001" data-y="-0.3" cx="571.0344877526745" cy="118.96551224732548" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="4.200001" data-y="1.8369701987210297e-17" cx="542.068975505349" cy="90" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="4.500001" data-y="0.3" cx="571.0344877526745" cy="61.03448775267453" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="180" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '180');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":96.55170749108491,"c":0,"e":136.55170749108493,"b":0,"d":-96.55170749108491,"f":90};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
