<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-1.2,-0.1 -1.4000000000000001,-0.10000000000000003" data-type="line" data-label="" points="238.0487804878049,446.3414634146341 224.390243902439,446.3414634146341" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="-1.2,0.1 -1.4000000000000001,0.30000000000000004" data-type="line" data-label="" points="238.0487804878049,432.6829268292683 224.390243902439,419.0243902439024" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="1.2,0 1.4000000000000001,0" data-type="line" data-label="" points="401.9512195121951,439.5121951219512 415.609756097561,439.5121951219512" fill="none" stroke="black" stroke-width="1px"/></g><g><rect data-type="rect" data-label="U1" data-x="0" data-y="0" x="251.7073170731707" y="302.92682926829264" width="136.58536585365857" height="273.17073170731715" fill="rgba(245, 158, 11, 0.18)" stroke="none" stroke-width="0.014642857142857141"/></g><g><rect data-type="rect" data-label="TP1" data-x="-1.6" data-y="-0.1" x="197.0731707317073" y="439.5121951219512" width="27.317073170731703" height="13.65853658536588" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.014642857142857141"/></g><g><rect data-type="rect" data-label="TP2" data-x="-1.6" data-y="0.30000000000000004" x="197.0731707317073" y="412.1951219512195" width="27.317073170731703" height="13.658536585365823" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.014642857142857141"/></g><g><rect data-type="rect" data-label="TP3" data-x="1.6" data-y="0" x="415.609756097561" y="432.6829268292683" width="27.317073170731703" height="13.658536585365823" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.014642857142857141"/></g><g><rect data-type="rect" data-label="BLOCKER" data-x="0" data-y="5" x="285.8536585365854" y="63.90243902439019" width="68.29268292682923" height="68.29268292682929" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.014642857142857141"/></g><g><rect data-type="rect" data-label="TP4" data-x="-4" data-y="4" x="40" y="152.68292682926824" width="13.658536585365823" height="27.31707317073176" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.014642857142857141"/></g><g><rect data-type="rect" data-label="TP5" data-x="0" data-y="4" x="306.3414634146341" y="159.5121951219512" width="27.31707317073176" height="13.658536585365823" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.014642857142857141"/></g><g><rect data-type="rect" data-label="TP6" data-x="4" data-y="4" x="586.3414634146343" y="152.68292682926824" width="13.658536585365823" height="27.31707317073176" fill="rgba(59, 130, 246, 0.12)" stroke="none" stroke-width="0.014642857142857141"/></g><text data-type="text" data-label="U1" data-x="0" data-y="0" x="320" y="439.5121951219512" fill="black" font-size="23.902439024390244" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="TP1" data-x="-1.6" data-y="-0.1" x="210.73170731707316" y="446.3414634146341" fill="black" font-size="5.463414634146342" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TP1</text><text data-type="text" data-label="TP2" data-x="-1.6" data-y="0.30000000000000004" x="210.73170731707316" y="419.0243902439024" fill="black" font-size="5.463414634146342" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TP2</text><text data-type="text" data-label="TP3" data-x="1.6" data-y="0" x="429.2682926829268" y="439.5121951219512" fill="black" font-size="5.463414634146342" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TP3</text><text data-type="text" data-label="BLOCKER" data-x="0" data-y="5" x="320" y="98.04878048780483" fill="black" font-size="15.02439024390244" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">BLOCKER</text><text data-type="text" data-label="TP4" data-x="-4" data-y="4" x="46.82926829268291" y="166.34146341463412" fill="black" font-size="5.463414634146342" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TP4</text><text data-type="text" data-label="TP5" data-x="0" data-y="4" x="320" y="166.34146341463412" fill="black" font-size="5.463414634146342" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TP5</text><text data-type="text" data-label="TP6" data-x="4" data-y="4" x="593.1707317073171" y="166.34146341463412" fill="black" font-size="5.463414634146342" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TP6</text><g><circle data-type="point" data-label="U1.left1" data-x="-1.2" data-y="-0.1" cx="238.0487804878049" cy="446.3414634146341" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.left2" data-x="-1.2" data-y="0.1" cx="238.0487804878049" cy="432.6829268292683" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.right1" data-x="1.2" data-y="0" cx="401.9512195121951" cy="439.5121951219512" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP1.1" data-x="-1.4000000000000001" data-y="-0.10000000000000003" cx="224.390243902439" cy="446.3414634146341" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP2.1" data-x="-1.4000000000000001" data-y="0.30000000000000004" cx="224.390243902439" cy="419.0243902439024" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP3.1" data-x="1.4000000000000001" data-y="0" cx="415.609756097561" cy="439.5121951219512" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP4.1" data-x="-4" data-y="3.8" cx="46.82926829268291" cy="180" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP5.1" data-x="0.2" data-y="4" cx="333.6585365853659" cy="166.34146341463412" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP6.1" data-x="4" data-y="4.2" cx="593.1707317073171" cy="152.68292682926824" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":68.29268292682927,"c":0,"e":320,"b":0,"d":-68.29268292682927,"f":439.5121951219512};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>