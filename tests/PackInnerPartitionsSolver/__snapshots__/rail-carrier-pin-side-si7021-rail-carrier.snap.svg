ont-size="21.999997010869972" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="C2" data-x="-2.0300000000000002" data-y="0" x="106.24999099864255" y="350" fill="black" font-size="14.574998019701356" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="R1" data-x="3.300001" data-y="0.2" x="772.50002547554" y="325.0000033967387" fill="black" font-size="13.749998131793731" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="1.9" data-y="-0.2" x="597.4999242527276" y="374.9999966032613" fill="black" font-size="13.749998131793731" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="4.500001" data-y="0" x="922.500005095108" y="350" fill="black" font-size="16.499997758152478" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1 (GND)" data-x="-1" data-y="0.2" cx="234.9999735054384" cy="325.0000033967387" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (V3_3)" data-x="-1" data-y="0" cx="234.9999735054384" cy="350" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="-0.2" cx="484.9999395380517" cy="374.9999966032613" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="0.2" cx="484.9999395380517" cy="325.0000033967387" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (GND)" data-x="-2.5600000000000005" data-y="3.245314017740486e-17" cx="40" cy="350" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (V3_3)" data-x="-1.5000000000000002" data-y="-3.245314017740486e-17" cx="172.49998199728506" cy="350" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="2.800001" data-y="0.20000000000000004" cx="710.0000339673867" cy="325.0000033967387" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="3.800001" data-y="0.19999999999999998" cx="835.0000169836933" cy="325.0000033967387" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="1.4" data-y="-0.19999999999999998" cx="534.9999327445744" cy="374.9999966032613" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="2.4" data-y="-0.20000000000000004" cx="659.999915760881" cy="374.9999966032613" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="4.500001" data-y="-0.3" cx="922.500005095108" cy="387.499994904892" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="4.200001" data-y="1.8369701987210297e-17" cx="885.000010190216" cy="350" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="4.500001" data-y="0.3" cx="922.500005095108" cy="312.500005095108" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":124.99998301630664,"c":0,"e":359.99995652174505,"b":0,"d":-124.99998301630664,"f":350};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
