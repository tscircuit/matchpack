y="0" x="174.49994833333332" y="350" fill="black" font-size="12.048666666666668" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="R1" data-x="3.300001" data-y="2.4" x="725.2667183333333" y="102.00000000000003" fill="black" font-size="11.366666666666665" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="R2" data-x="1.9" data-y="2" x="580.5999483333333" y="143.33333333333334" fill="black" font-size="11.366666666666665" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="SJ1" data-x="4.500001" data-y="2.2" x="849.2667183333333" y="122.66666666666666" fill="black" font-size="13.64" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SJ1</text><g><circle data-type="point" data-label="U1.1 (GND)" data-x="-1" data-y="0.2" cx="280.9332816666667" cy="329.3333333333333" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (V3_3)" data-x="-1" data-y="0" cx="280.9332816666667" cy="350" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (SCL)" data-x="1" data-y="2" cx="487.5999483333333" cy="143.33333333333334" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (SDA)" data-x="1" data-y="2.4" cx="487.5999483333333" cy="102.00000000000003" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1 (GND)" data-x="-2.5600000000000005" data-y="3.245314017740486e-17" cx="119.73328166666664" cy="350" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2 (V3_3)" data-x="-1.5000000000000002" data-y="-3.245314017740486e-17" cx="229.26661499999997" cy="350" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1 (SDA)" data-x="2.800001" data-y="2.4" cx="673.6000516666667" cy="102.00000000000003" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2" data-x="3.800001" data-y="2.4" cx="776.933385" cy="102.00000000000003" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.1 (SCL)" data-x="1.4" data-y="2" cx="528.9332816666666" cy="143.33333333333334" r="3" fill="black"/></g><g><circle data-type="point" data-label="R2.2" data-x="2.4" data-y="2" cx="632.266615" cy="143.33333333333334" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.1 (R2.2)" data-x="4.500001" data-y="1.9000000000000001" cx="849.2667183333333" cy="153.66666666666666" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.2 (V3_3)" data-x="4.200001" data-y="2.2" cx="818.2667183333333" cy="122.66666666666666" r="3" fill="black"/></g><g><circle data-type="point" data-label="SJ1.3 (R1.2)" data-x="4.500001" data-y="2.5" cx="849.2667183333333" cy="91.66666666666669" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":103.33333333333333,"c":0,"e":384.266615,"b":0,"d":-103.33333333333333,"f":350};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
