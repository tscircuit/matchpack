e="15.4" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C1</text><text data-type="text" data-label="C2" data-x="-2.2450000000000006" data-y="-0.25" x="171.41509433962267" y="263.8679245283019" fill="black" font-size="15.4" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="C5" data-x="-0.785" data-y="-1.3000000000000003" x="364.245283018868" y="402.5471698113208" fill="black" font-size="15.4" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C5</text><text data-type="text" data-label="U1" data-x="0" data-y="0" x="467.9245283018869" y="230.8490566037736" fill="black" font-size="29.056603773584904" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><g><circle data-type="point" data-label="C6.1" data-x="-1.5150000000000001" data-y="0.30000000000000004" cx="267.83018867924534" cy="191.22641509433961" r="3" fill="black"/></g><g><circle data-type="point" data-label="C6.2" data-x="-1.5150000000000001" data-y="-0.8" cx="267.83018867924534" cy="336.50943396226415" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-2.9750000000000005" data-y="0.30000000000000004" cx="75" cy="191.22641509433961" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="-2.9750000000000005" data-y="-0.8" cx="75" cy="336.50943396226415" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="-2.2450000000000006" data-y="0.30000000000000004" cx="171.41509433962267" cy="191.22641509433961" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2" data-x="-2.2450000000000006" data-y="-0.8" cx="171.41509433962267" cy="336.50943396226415" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.1" data-x="-0.785" data-y="-0.7500000000000002" cx="364.245283018868" cy="329.9056603773585" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.2 (GND)" data-x="-0.785" data-y="-1.8500000000000003" cx="364.245283018868" cy="475.1886792452831" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1 (VSYS)" data-x="-1" data-y="0.30000000000000004" cx="335.84905660377365" cy="191.22641509433961" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (GND)" data-x="-1" data-y="0.10000000000000003" cx="335.84905660377365" cy="217.64150943396226" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-1" data-y="-0.09999999999999998" cx="335.84905660377365" cy="244.0566037735849" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (V3_3)" data-x="-1" data-y="-0.30000000000000004" cx="335.84905660377365" cy="270.47169811320754" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1" data-y="-0.30000000000000004" cx="600.0000000000001" cy="270.47169811320754" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1" data-y="-0.10000000000000003" cx="600.0000000000001" cy="244.05660377358492" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1" data-y="0.09999999999999998" cx="600.0000000000001" cy="217.64150943396228" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="1" data-y="0.30000000000000004" cx="600.0000000000001" cy="191.22641509433961" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":132.0754716981132,"c":0,"e":467.9245283018869,"b":0,"d":-132.0754716981132,"f":230.8490566037736};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>