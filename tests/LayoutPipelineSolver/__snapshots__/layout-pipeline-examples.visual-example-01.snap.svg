a-label="U1.2 (unnamedsubcircuit52_connectivity_net1)" data-x="3.8997266500000007" data-y="5.0512093" cx="530.785963128825" cy="42.66406382296975" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3 (unnamedsubcircuit52_connectivity_net0)" data-x="3.699726650000001" data-y="5.0512093" cx="499.99154782383744" cy="42.66406382296975" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4" data-x="3.7997266500000006" data-y="3.0512093" cx="515.3887554763312" cy="350.60821687284607" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5 (unnamedsubcircuit52_connectivity_net2)" data-x="3.9997266500000004" data-y="3.0512093" cx="546.1831707813187" cy="350.60821687284607" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":153.97207652493816,"c":0,"e":-69.66304705131586,"b":0,"d":-153.97207652493816,"f":820.4092487060491};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>