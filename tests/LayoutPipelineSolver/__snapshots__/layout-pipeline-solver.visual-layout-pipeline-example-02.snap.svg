 dominant-baseline="central">C1</text><text data-type="text" data-label="C2" data-x="-2.2450000000000006" data-y="-0.4500000000000004" x="70.22403258655805" y="364.4806517311609" fill="black" font-size="13.298574338085537" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="C5" data-x="1.85" data-y="0.10000000000000009" x="537.2708757637474" y="301.7515274949083" fill="black" font-size="13.298574338085537" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C5</text><text data-type="text" data-label="U1" data-x="0" data-y="0" x="326.27291242362526" y="313.1568228105906" fill="black" font-size="15.05498981670061" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><g><circle data-type="point" data-label="C6.1" data-x="-1.5150000000000001" data-y="0.09999999999999987" cx="153.48268839103872" cy="301.7515274949083" r="3" fill="black"/></g><g><circle data-type="point" data-label="C6.2" data-x="-1.5150000000000001" data-y="-1.0000000000000002" cx="153.48268839103872" cy="427.2097759674134" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-2.4000000000000004" data-y="0.615" cx="52.545824847250515" cy="243.0142566191446" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="-1.3" data-y="0.615" cx="178.00407331975563" cy="243.0142566191446" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="-2.2450000000000006" data-y="0.09999999999999964" cx="70.22403258655805" cy="301.7515274949084" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2" data-x="-2.2450000000000006" data-y="-1.0000000000000004" cx="70.22403258655805" cy="427.2097759674134" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.1" data-x="1.3" data-y="0.10000000000000012" cx="474.54175152749485" cy="301.7515274949083" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.2 (GND)" data-x="2.4000000000000004" data-y="0.10000000000000006" cx="600" cy="301.7515274949083" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1 (VSYS)" data-x="-1" data-y="0.1" cx="212.21995926680248" cy="301.7515274949083" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (GND)" data-x="-1" data-y="-0.1" cx="212.21995926680248" cy="324.5621181262729" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="1" data-y="-0.1" cx="440.32586558044807" cy="324.5621181262729" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (V3_3)" data-x="1" data-y="0.1" cx="440.32586558044807" cy="301.7515274949083" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":114.05295315682278,"c":0,"e":326.27291242362526,"b":0,"d":-114.05295315682278,"f":313.1568228105906};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>