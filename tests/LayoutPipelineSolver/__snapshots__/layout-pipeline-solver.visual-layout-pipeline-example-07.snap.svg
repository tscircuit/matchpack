247617" cy="327.0714851483608" r="3" fill="black"/></g><g><circle data-type="point" data-label="U3.5" data-x="1.4" data-y="0.10000000000000009" cx="490.312174247617" cy="349.70023762311547" r="3" fill="black"/></g><g><circle data-type="point" data-label="U3.2" data-x="1.4" data-y="-0.09999999999999998" cx="490.312174247617" cy="372.3289900978701" r="3" fill="black"/></g><g><circle data-type="point" data-label="U3.3 (unnamedsubcircuit33_connectivity_net0)" data-x="1.4" data-y="-0.3" cx="490.312174247617" cy="394.95774257262474" r="3" fill="black"/></g><g><circle data-type="point" data-label="U3.7 (unnamedsubcircuit33_connectivity_net0)" data-x="1.4" data-y="-0.5" cx="490.312174247617" cy="417.58649504737934" r="3" fill="black"/></g><g><circle data-type="point" data-label="C20.1 (unnamedsubcircuit33_connectivity_net0)" data-x="-2.315" data-y="0.22500000000000003" cx="69.98309702904987" cy="335.5572673263938" r="3" fill="black"/></g><g><circle data-type="point" data-label="C20.2 (unnamedsubcircuit33_connectivity_net1)" data-x="-2.315" data-y="-0.875" cx="69.98309702904987" cy="460.01540593754424" r="3" fill="black"/></g><g><circle data-type="point" data-label="R11.1 (unnamedsubcircuit33_connectivity_net0)" data-x="2.2097276749999994" data-y="1.6000000000000005" cx="581.9278098952848" cy="179.9845940624557" r="3" fill="black"/></g><g><circle data-type="point" data-label="R11.2 (unnamedsubcircuit33_connectivity_net5)" data-x="2.2097276749999994" data-y="0.5000000000000007" cx="581.9278098952848" cy="304.44273267360614" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":113.14376237377313,"c":0,"e":331.91090692433465,"b":0,"d":-113.14376237377313,"f":361.0146138604928};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>