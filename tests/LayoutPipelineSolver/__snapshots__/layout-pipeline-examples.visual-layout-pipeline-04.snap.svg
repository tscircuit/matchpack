" dominant-baseline="central">U2</text><g><circle data-type="point" data-label="C6.1" data-x="-1.514999999999999" data-y="-3.2800000000000002" cx="248.22934232715008" cy="396.964586846543" r="3" fill="black"/></g><g><circle data-type="point" data-label="C6.2" data-x="-1.514999999999999" data-y="-4.38" cx="248.22934232715008" cy="500.8431703204047" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-2.399999999999999" data-y="-2.765" cx="164.65430016863405" cy="348.33052276559863" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="-1.299999999999999" data-y="-2.765" cx="268.5328836424958" cy="348.33052276559863" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="-2.244999999999999" data-y="-3.2800000000000002" cx="179.29173693086" cy="396.964586846543" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2" data-x="-2.244999999999999" data-y="-4.38" cx="179.29173693086" cy="500.8431703204047" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.1" data-x="-0.7849999999999989" data-y="-4.330000000000001" cx="317.1669477234401" cy="496.1214165261383" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.2 (GND)" data-x="-0.7849999999999989" data-y="-5.430000000000001" cx="317.1669477234401" cy="600" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1 (VSYS)" data-x="-0.9999999999999989" data-y="-3.2800000000000002" cx="296.8634064080944" cy="396.964586846543" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (GND)" data-x="-0.9999999999999989" data-y="-3.48" cx="296.8634064080944" cy="415.85160202360873" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-0.9999999999999989" data-y="-3.68" cx="296.8634064080944" cy="434.7386172006745" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (V3_3)" data-x="-0.9999999999999989" data-y="-3.88" cx="296.8634064080944" cy="453.62563237774026" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1.000000000000001" data-y="-3.88" cx="485.7335581787521" cy="453.62563237774026" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1.000000000000001" data-y="-3.68" cx="485.7335581787521" cy="434.7386172006745" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1.000000000000001" data-y="-3.48" cx="485.7335581787521" cy="415.85160202360873" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="1.000000000000001" data-y="-3.2800000000000002" cx="485.7335581787521" cy="396.964586846543" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.1 (VCC)" data-x="-1" data-y="0.30000000000000004" cx="296.8634064080943" cy="58.88701517706577" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.2 (GND)" data-x="-1" data-y="0.10000000000000003" cx="296.8634064080943" cy="77.77403035413154" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.3" data-x="-1" data-y="-0.09999999999999998" cx="296.8634064080943" cy="96.6610455311973" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.4" data-x="-1" data-y="-0.30000000000000004" cx="296.8634064080943" cy="115.54806070826308" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.5" data-x="1" data-y="-0.30000000000000004" cx="485.733558178752" cy="115.54806070826308" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.6" data-x="1" data-y="-0.10000000000000003" cx="485.733558178752" cy="96.6610455311973" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.7" data-x="1" data-y="0.09999999999999998" cx="485.733558178752" cy="77.77403035413154" r="3" fill="black"/></g><g><circle data-type="point" data-label="U2.8" data-x="1" data-y="0.30000000000000004" cx="485.733558178752" cy="58.88701517706577" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":94.43507588532883,"c":0,"e":391.29848229342315,"b":0,"d":-94.43507588532883,"f":87.21753794266442};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>