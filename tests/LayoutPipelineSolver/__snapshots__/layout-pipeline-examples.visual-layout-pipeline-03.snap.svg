29914538" y="128.54700854700855" fill="black" font-size="18.602849002849002" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C1</text><text data-type="text" data-label="C2" data-x="-2.2450000000000006" data-y="-0.25" x="82.27920227920231" y="298.46153846153845" fill="black" font-size="18.602849002849002" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="C5" data-x="-0.785" data-y="-1.3000000000000003" x="315.2136752136753" y="465.982905982906" fill="black" font-size="18.602849002849002" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C5</text><text data-type="text" data-label="U1" data-x="0" data-y="0" x="440.45584045584053" y="258.57549857549856" fill="black" font-size="35.0997150997151" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><g><circle data-type="point" data-label="C6.1" data-x="-1.5150000000000001" data-y="0.30000000000000004" cx="198.74643874643883" cy="210.7122507122507" r="3" fill="black"/></g><g><circle data-type="point" data-label="C6.2" data-x="-1.5150000000000001" data-y="-0.8" cx="198.74643874643883" cy="386.2108262108262" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="-2.4000000000000004" data-y="0.8150000000000001" cx="57.54985754985762" cy="128.54700854700855" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2" data-x="-1.3" data-y="0.8150000000000001" cx="233.04843304843314" cy="128.54700854700855" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.1" data-x="-2.2450000000000006" data-y="0.30000000000000004" cx="82.27920227920231" cy="210.7122507122507" r="3" fill="black"/></g><g><circle data-type="point" data-label="C2.2" data-x="-2.2450000000000006" data-y="-0.8" cx="82.27920227920231" cy="386.2108262108262" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.1" data-x="-0.785" data-y="-0.7500000000000002" cx="315.2136752136753" cy="378.23361823361824" r="3" fill="black"/></g><g><circle data-type="point" data-label="C5.2 (GND)" data-x="-0.785" data-y="-1.8500000000000003" cx="315.2136752136753" cy="553.7321937321938" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.1 (VSYS)" data-x="-1" data-y="0.30000000000000004" cx="280.911680911681" cy="210.7122507122507" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2 (GND)" data-x="-1" data-y="0.10000000000000003" cx="280.911680911681" cy="242.6210826210826" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.3" data-x="-1" data-y="-0.09999999999999998" cx="280.911680911681" cy="274.5299145299145" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.4 (V3_3)" data-x="-1" data-y="-0.30000000000000004" cx="280.911680911681" cy="306.4387464387464" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.5" data-x="1" data-y="-0.30000000000000004" cx="600" cy="306.4387464387464" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.6" data-x="1" data-y="-0.10000000000000003" cx="600" cy="274.5299145299145" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.7" data-x="1" data-y="0.09999999999999998" cx="600" cy="242.62108262108262" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.8" data-x="1" data-y="0.30000000000000004" cx="600" cy="210.7122507122507" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":159.54415954415953,"c":0,"e":440.45584045584053,"b":0,"d":-159.54415954415953,"f":258.57549857549856};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>