<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="1.1000000000000005,0.5700000000000003 1.1,0.1" data-type="line" data-label="" points="355.0000000000001,320.87499999999994 355,403.125" fill="none" stroke="black" stroke-width="1px"/></g><g><polyline data-points="1.4000000000000001,-0.10000000000000006 1.1,-0.1" data-type="line" data-label="" points="407.5,438.125 355,438.125" fill="none" stroke="black" stroke-width="1px"/></g><g><rect data-type="rect" data-label="U1" data-x="0" data-y="0" x="40" y="368.125" width="245" height="105" fill="rgba(245, 158, 11, 0.18)" stroke="none" stroke-width="0.005714285714285714"/></g><g><rect data-type="rect" data-label="R1" data-x="1.1000000000000005" data-y="1.1200000000000003" x="320.9703137500002" y="128.37499999999994" width="68.05937249999982" height="192.5" fill="rgba(16, 185, 129, 0.18)" stroke="none" stroke-width="0.005714285714285714"/></g><g><rect data-type="rect" data-label="C1" data-x="1.9500000000000002" data-y="-0.10000000000000009" x="407.50000000000006" y="364.625" width="192.5" height="147" fill="rgba(59, 130, 246, 0.18)" stroke="none" stroke-width="0.005714285714285714"/></g><text data-type="text" data-label="U1" data-x="0" data-y="0" x="162.5" y="420.625" fill="black" font-size="23.100000000000005" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1</text><text data-type="text" data-label="R1" data-x="1.1000000000000005" data-y="1.1200000000000003" x="355.0000000000001" y="224.62499999999994" fill="black" font-size="14.973061949999963" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1</text><text data-type="text" data-label="C1" data-x="1.9500000000000002" data-y="-0.10000000000000009" x="503.75000000000006" y="438.125" fill="black" font-size="32.339999999999996" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C1</text><g><circle data-type="point" data-label="U1.1" data-x="1.1" data-y="0.1" cx="355" cy="403.125" r="3" fill="black"/></g><g><circle data-type="point" data-label="U1.2" data-x="1.1" data-y="-0.1" cx="355" cy="438.125" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.1" data-x="1.1000000000000005" data-y="0.5700000000000003" cx="355.0000000000001" cy="320.87499999999994" r="3" fill="black"/></g><g><circle data-type="point" data-label="R1.2 (VCC)" data-x="1.1000000000000005" data-y="1.6700000000000006" cx="355.0000000000001" cy="128.3749999999999" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.1" data-x="1.4000000000000001" data-y="-0.10000000000000006" cx="407.5" cy="438.125" r="3" fill="black"/></g><g><circle data-type="point" data-label="C1.2 (GND)" data-x="2.5" data-y="-0.10000000000000012" cx="600" cy="438.125" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":175,"c":0,"e":162.5,"b":0,"d":-175,"f":420.625};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
